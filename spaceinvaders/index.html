<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Neon Space Invaders</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  :root{--ui:24px}
  @media (pointer:coarse){:root{--ui:110px}}
  html,body{height:100%;background:#05030f;color:#fff;font-family:Orbitron,'Courier New',monospace;overflow:hidden;touch-action:none}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
  #wrap{width:min(100vw,calc((100dvh - var(--ui)) * 4 / 3));aspect-ratio:4/3}
  canvas{width:100%;height:100%;display:block;border-radius:12px;
    box-shadow:0 0 40px #6a3cff88,0 0 0 2px #3b2a8f}
  #controls{display:none;gap:14px;width:min(100vw,520px);padding:0 14px}
  @media (pointer:coarse){#controls{display:flex}}
  .btn{flex:1;height:70px;border-radius:16px;border:2px solid #6a3cff;background:#150e3a;color:#cfc4ff;
    font:900 22px Orbitron,monospace;box-shadow:0 0 14px #6a3cff66 inset}
  .btn:active,.btn.on{background:#2b1b7a;border-color:#4ff0ff;color:#fff}
  #fire{flex:1.4;border-color:#ff4fd8}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="controls">
  <button class="btn" id="bl">◀</button>
  <button class="btn" id="fire">FIRE</button>
  <button class="btn" id="br">▶</button>
</div>

<script>
(() => {
'use strict';
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const W = 800, H = 600; cv.width = W; cv.height = H;
const FONT = "Orbitron,'Courier New',monospace";
const rand = (a, b) => a + Math.random() * (b - a);
const hit = (ax, ay, aw, ah, bx, by, bw, bh) => Math.abs(ax - bx) < (aw + bw) / 2 && Math.abs(ay - by) < (ah + bh) / 2;

/* ---------- AUDIO ---------- */
let audio = null;
function initAudio() {
  try { if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === 'suspended') audio.resume(); } catch (e) {}
}
function tone(f, d = .1, type = 'square', v = .05, slide = 0) {
  if (!audio) return;
  const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + d);
}
function noise(d = .35, v = .12) {
  if (!audio) return;
  const n = Math.floor(audio.sampleRate * d), buf = audio.createBuffer(1, n, audio.sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = audio.createBufferSource(), g = audio.createGain();
  s.buffer = buf; g.gain.value = v; s.connect(g); g.connect(audio.destination); s.start();
}

/* ---------- SPRITES ---------- */
const ART = {
  squid: [
    ['00011000','00111100','01111110','11011011','11111111','00100100','01011010','10100101'],
    ['00011000','00111100','01111110','11011011','11111111','01011010','10000001','01000010']],
  crab: [
    ['00100000100','00010001000','00111111100','01101110110','11111111111','10111111101','10100000101','00011011000'],
    ['00100000100','10010001001','10111111101','11101110111','11111111111','01111111110','00100000100','01000000010']],
  octo: [
    ['000011110000','011111111110','111111111111','111001100111','111111111111','000110011000','001101101100','110000000011'],
    ['000011110000','011111111110','111111111111','111001100111','111111111111','001110011100','011001100110','001100001100']]
};
function build(rows, color, scale) {
  const p = 14, w = rows[0].length * scale, h = rows.length * scale;
  const c = document.createElement('canvas'); c.width = w + p * 2; c.height = h + p * 2;
  const x = c.getContext('2d');
  const paint = () => rows.forEach((r, j) => [...r].forEach((ch, i) => { if (ch === '1') x.fillRect(p + i * scale, p + j * scale, scale, scale); }));
  x.shadowColor = color; x.shadowBlur = 14; x.fillStyle = color; paint();
  x.shadowBlur = 0; x.globalAlpha = .35; x.fillStyle = '#fff'; paint();
  return { c, w, h };
}
const SPR = [
  ART.squid.map(r => build(r, '#ff4fd8', 3)),
  ART.crab.map(r => build(r, '#4ff0ff', 3)),
  ART.octo.map(r => build(r, '#7dff6a', 3))
];
const POINTS = [30, 20, 10];

/* ---------- POWER-UP TYPES ---------- */
const PW = {
  triple: { col: '#ff4fd8', ch: 'T', name: 'TRIPLE SHOT', w: 30 },
  rapid:  { col: '#ffd84f', ch: 'R', name: 'RAPID FIRE',  w: 30 },
  shield: { col: '#4ff0ff', ch: 'S', name: 'SHIELD',      w: 30 },
  life:   { col: '#7dff6a', ch: '+', name: 'EXTRA LIFE',  w: 10 }
};

/* ---------- BACKGROUND ---------- */
const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
(() => {
  const x = bg.getContext('2d');
  const base = x.createLinearGradient(0, 0, 0, H);
  base.addColorStop(0, '#05030f'); base.addColorStop(1, '#120a30');
  x.fillStyle = base; x.fillRect(0, 0, W, H);
  [[160, 150, 260, '#5b2bff'], [650, 260, 300, '#ff2bb5'], [420, 480, 280, '#1b6bff']].forEach(([cx, cy, r, col]) => {
    const g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, col + '44'); g.addColorStop(1, col + '00');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
  });
})();
const stars = [];
for (let i = 0; i < 140; i++) {
  const layer = i % 3;
  stars.push({ x: rand(0, W), y: rand(0, H), v: 12 + layer * 22, r: .6 + layer * .5, ph: rand(0, 6.28) });
}

/* ---------- STATE ---------- */
let state = 'menu', score = 0, lives = 3, level = 1, time = 0, paused = false;
let hi = 0; try { hi = +localStorage.getItem('si_hi') || 0; } catch (e) {}
let aliens = [], dir = 1, stepT = 0, frame = 0, march = 0;
let pBul = [], eBul = [], shields = [], parts = [], rings = [], texts = [], drops = [];
let ufo = null, ufoT = rand(12, 20), eT = 1, shake = 0, banner = 0, bannerText = '', clearT = 0;
let combo = 0, comboT = 0, boss = null;
const power = { triple: 0, rapid: 0, shield: false };
const player = { x: W / 2, y: H - 58, w: 40, h: 30, cd: 0, inv: 0, dead: 0 };
const keys = { left: false, right: false, fire: false };

const isBossLevel = () => level % 5 === 0;

function spawnWave() {
  aliens = []; boss = null; clearT = 0;
  if (isBossLevel()) {
    const hp = 25 + level * 3;
    boss = { x: W / 2, y: 110, hp, max: hp, dir: 1, t: 0, fireT: 1.8, flash: 0 };
    bannerText = '⚠ BOSS INCOMING ⚠'; banner = 2.2;
    tone(120, .6, 'sawtooth', .07, -50);
  } else {
    for (let r = 0; r < 5; r++) for (let c = 0; c < 11; c++)
      aliens.push({ r, c, x: 110 + c * 52, y: 100 + r * 42 + Math.min(level - 1, 6) * 14, type: r === 0 ? 0 : r < 3 ? 1 : 2 });
    bannerText = 'WAVE ' + level; banner = 1.6;
  }
  dir = 1; stepT = .5; frame = 0; pBul = []; eBul = []; drops = []; makeShields();
}
function makeShields() {
  shields = []; const n = 4, bs = 5;
  for (let s = 0; s < n; s++) {
    const ox = (W / n) * s + W / n / 2 - 45, oy = H - 150;
    for (let r = 0; r < 12; r++) for (let c = 0; c < 18; c++) {
      if (r < 3 && (c < 3 - r || c > 14 + r)) continue;
      if (r >= 8 && c >= 5 && c <= 12) continue;
      shields.push({ x: ox + c * bs, y: oy + r * bs, s: bs });
    }
  }
}
function startGame() {
  score = 0; lives = 3; level = 1; ufo = null; ufoT = rand(12, 20);
  parts = []; rings = []; texts = []; drops = [];
  combo = 0; comboT = 0; power.triple = 0; power.rapid = 0; power.shield = false;
  player.x = W / 2; player.inv = 1.5; player.dead = 0; player.cd = 0;
  spawnWave(); state = 'play';
}
function gameOver() {
  state = 'over';
  if (score > hi) { hi = score; try { localStorage.setItem('si_hi', hi); } catch (e) {} }
  tone(200, .8, 'sawtooth', .08, -150);
}

/* ---------- FX ---------- */
function explode(x, y, color, n = 26, power = 220) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, 6.283), s = rand(30, power);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(.4, .9), max: .9, color, size: rand(1.5, 3.5) });
  }
  rings.push({ x, y, r: 4, life: .45, max: .45, color });
}
function floatText(x, y, str, color) { texts.push({ x, y, str, color, life: 1 }); }

/* ---------- POWER-UPS ---------- */
function spawnDrop(x, y, forced) {
  const pool = Object.keys(PW).filter(k => !(k === 'life' && lives >= 5));
  const total = pool.reduce((s, k) => s + PW[k].w, 0);
  let r = Math.random() * total, type = pool[0];
  for (const k of pool) { r -= PW[k].w; if (r <= 0) { type = k; break; } }
  drops.push({ x, y, type, t: 0 });
}
function applyPower(type) {
  if (type === 'triple') power.triple = 10;
  if (type === 'rapid') power.rapid = 8;
  if (type === 'shield') power.shield = true;
  if (type === 'life') lives = Math.min(5, lives + 1);
  floatText(player.x, player.y - 30, PW[type].name, PW[type].col);
  [600, 800, 1000].forEach((f, i) => setTimeout(() => tone(f, .1, 'triangle', .06), i * 70));
}
function playerHit() {
  if (power.shield) {
    power.shield = false; player.inv = 1.2;
    explode(player.x, player.y, '#4ff0ff', 24, 200); tone(300, .3, 'sine', .08, 400); shake = 4;
    return;
  }
  lives--; combo = 0; comboT = 0; power.triple = 0; power.rapid = 0;
  explode(player.x, player.y, '#4ff0ff', 50, 320); noise(.6, .15); shake = 12;
  player.dead = 1.1;
  if (lives <= 0) gameOver();
}

/* ---------- BOSS ---------- */
function bossFire(p2) {
  const n = p2 ? 5 : 3, sp = p2 ? .22 : .16, mid = (n - 1) / 2;
  const base = Math.max(-.5, Math.min(.5, (player.x - boss.x) / H * .8));
  for (let i = 0; i < n; i++) {
    const ang = base + (i - mid) * sp;
    eBul.push({ x: boss.x + (i - mid) * 22, y: boss.y + 34, vx: Math.sin(ang) * 300, vy: Math.cos(ang) * 300, t: 0 });
  }
  tone(140, .25, 'sawtooth', .05, -60);
}
function killBoss() {
  const bx = boss.x, by = boss.y;
  for (let i = 0; i < 9; i++) setTimeout(() => {
    explode(bx + rand(-70, 70), by + rand(-30, 30), ['#ff6a8a', '#ffd84f', '#fff'][i % 3], 40, 320);
    noise(.4, .12); shake = 10;
  }, i * 110);
  score += 1000; floatText(bx, by, '+1000', '#ffd84f');
  spawnDrop(bx - 30, by); spawnDrop(bx + 30, by);
  eBul = []; boss = null;
}

/* ---------- UPDATE ---------- */
function update(dt) {
  time += dt;
  for (const s of stars) { s.y += s.v * dt * (state === 'play' ? 1 : .4); if (s.y > H) { s.y = 0; s.x = rand(0, W); } }
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .985; p.vy *= .985; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const r of rings) { r.r += 180 * dt; r.life -= dt; }
  rings = rings.filter(r => r.life > 0);
  for (const t of texts) { t.y -= 30 * dt; t.life -= dt; }
  texts = texts.filter(t => t.life > 0);
  shake = Math.max(0, shake - dt * 30);
  if (state !== 'play') return;

  if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }
  power.triple = Math.max(0, power.triple - dt);
  power.rapid = Math.max(0, power.rapid - dt);

  // player
  if (player.dead > 0) {
    player.dead -= dt;
    if (player.dead <= 0) { player.inv = 2; player.x = W / 2; }
  } else {
    player.inv = Math.max(0, player.inv - dt);
    if (keys.left) player.x -= 330 * dt;
    if (keys.right) player.x += 330 * dt;
    player.x = Math.max(30, Math.min(W - 30, player.x));
    player.cd -= dt;
    if (keys.fire && player.cd <= 0) {
      if (power.triple > 0) [-150, 0, 150].forEach(vx => pBul.push({ x: player.x, y: player.y - 24, vx }));
      else pBul.push({ x: player.x, y: player.y - 24, vx: 0 });
      player.cd = power.rapid > 0 ? .15 : .36;
      tone(900, .1, 'square', .035, -600);
    }
  }

  // power-up drops
  for (const d of drops) { d.y += 110 * dt; d.t += dt; }
  if (player.dead <= 0) for (const d of drops) {
    if (hit(d.x, d.y, 24, 24, player.x, player.y, player.w, player.h)) { d.got = true; applyPower(d.type); }
  }
  drops = drops.filter(d => !d.got && d.y < H + 20);

  // player bullets
  for (const b of pBul) {
    b.y -= 640 * dt; b.x += b.vx * dt;
    if (Math.random() < .6) parts.push({ x: b.x, y: b.y + 10, vx: rand(-15, 15), vy: rand(20, 60), life: .25, max: .25, color: '#7ff', size: 1.4 });
  }
  pBul = pBul.filter(b => b.y > -20 && b.x > -20 && b.x < W + 20);

  if (banner > 0) { banner -= dt; return; }

  // alien march
  if (aliens.length) {
    stepT -= dt;
    if (stepT <= 0) {
      stepT = Math.max(.035, (aliens.length / 55) * .75 - (level - 1) * .04);
      frame ^= 1; tone([110, 98, 87, 82][march = (march + 1) % 4], .08, 'square', .045);
      const edge = aliens.some(a => (dir > 0 && a.x > W - 34) || (dir < 0 && a.x < 34));
      if (edge) { dir *= -1; aliens.forEach(a => a.y += 18); }
      else aliens.forEach(a => a.x += dir * 10);
    }
  }

  // boss
  if (boss) {
    boss.t += dt; boss.flash -= dt;
    const p2 = boss.hp < boss.max * .5;
    boss.x += boss.dir * (90 + level * 3 + (p2 ? 70 : 0)) * dt;
    if (boss.x > W - 100) { boss.x = W - 100; boss.dir = -1; }
    if (boss.x < 100) { boss.x = 100; boss.dir = 1; }
    boss.y = 110 + Math.sin(boss.t * 1.5) * 10;
    boss.fireT -= dt;
    if (boss.fireT <= 0) { bossFire(p2); boss.fireT = Math.max(.6, (p2 ? .95 : 1.5) - level * .02); }
  }

  // alien fire
  eT -= dt;
  if (eT <= 0 && aliens.length) {
    const bottom = {};
    aliens.forEach(a => { if (!bottom[a.c] || a.y > bottom[a.c].y) bottom[a.c] = a; });
    const cols = Object.values(bottom), a = cols[Math.floor(Math.random() * cols.length)];
    eBul.push({ x: a.x, y: a.y + 14, vx: 0, vy: 230 + level * 18, t: 0 });
    eT = Math.max(.35, 1.1 - level * .08) * rand(.5, 1.3);
    tone(220, .15, 'sawtooth', .025, -100);
  }
  for (const b of eBul) { b.y += b.vy * dt; b.x += (b.vx || 0) * dt; b.t += dt; }
  eBul = eBul.filter(b => b.y < H + 20 && b.x > -20 && b.x < W + 20);

  // UFO
  ufoT -= dt;
  if (!ufo && !boss && ufoT <= 0) { const d = Math.random() < .5 ? 1 : -1; ufo = { x: d > 0 ? -40 : W + 40, y: 62, d, snd: 0 }; }
  if (ufo) {
    ufo.x += ufo.d * 130 * dt; ufo.snd -= dt;
    if (ufo.snd <= 0) { tone(520 + Math.sin(time * 10) * 120, .12, 'sine', .035); ufo.snd = .14; }
    if (ufo.x < -60 || ufo.x > W + 60) { ufo = null; ufoT = rand(14, 24); }
  }

  // bullets vs aliens / ufo / boss
  for (const b of pBul) {
    if (b.dead) continue;
    for (const a of aliens) {
      const s = SPR[a.type][frame];
      if (hit(b.x, b.y, 3, 14, a.x, a.y, s.w, s.h)) {
        a.dead = true; b.dead = true;
        combo = comboT > 0 ? Math.min(5, combo + 1) : 1; comboT = 1.6;
        const pts = POINTS[a.type] * combo; score += pts;
        if (combo >= 2) floatText(a.x, a.y, '+' + pts, '#ffd84f');
        if (Math.random() < .07) spawnDrop(a.x, a.y);
        explode(a.x, a.y, ['#ff4fd8', '#4ff0ff', '#7dff6a'][a.type]); noise(.25, .09); shake = 3; break;
      }
    }
    if (b.dead) continue;
    if (ufo && hit(b.x, b.y, 3, 14, ufo.x, ufo.y, 44, 18)) {
      const pts = [50, 100, 150, 300][Math.floor(Math.random() * 4)];
      score += pts; floatText(ufo.x, ufo.y, '+' + pts, '#ffd84f');
      spawnDrop(ufo.x, ufo.y);
      explode(ufo.x, ufo.y, '#ff5a5a', 40, 300); noise(.5, .12); shake = 6;
      ufo = null; ufoT = rand(14, 24); b.dead = true; continue;
    }
    if (boss && hit(b.x, b.y, 3, 14, boss.x, boss.y, 150, 70)) {
      b.dead = true; boss.hp--; boss.flash = .07; score += 10;
      for (let i = 0; i < 4; i++) parts.push({ x: b.x, y: b.y, vx: rand(-120, 120), vy: rand(-40, 120), life: .4, max: .4, color: '#ffb84f', size: 2 });
      tone(180, .05, 'square', .03);
      if (boss.hp <= 0) killBoss();
    }
  }
  aliens = aliens.filter(a => !a.dead);
  pBul = pBul.filter(b => !b.dead);

  // bullets vs shields
  for (const arr of [pBul, eBul]) {
    for (const b of arr) {
      const hh = arr === pBul ? 14 : 12;
      const hitBlocks = shields.filter(s => hit(b.x, b.y, 3, hh, s.x + s.s / 2, s.y + s.s / 2, s.s, s.s));
      if (hitBlocks.length) {
        b.dead = true;
        shields = shields.filter(s => Math.hypot(s.x - b.x, s.y - b.y) > 10);
        for (let i = 0; i < 6; i++) parts.push({ x: b.x, y: b.y, vx: rand(-80, 80), vy: rand(-80, 80), life: .4, max: .4, color: '#5dff9a', size: 2 });
      }
    }
  }
  pBul = pBul.filter(b => !b.dead); eBul = eBul.filter(b => !b.dead);
  aliens.forEach(a => { shields = shields.filter(s => !hit(a.x, a.y, 30, 24, s.x + s.s / 2, s.y + s.s / 2, s.s, s.s)); });

  // enemy bullets vs player
  if (player.dead <= 0 && player.inv <= 0) {
    for (const b of eBul) {
      if (hit(b.x, b.y, 4, 12, player.x, player.y, player.w, player.h)) { b.dead = true; playerHit(); break; }
    }
    eBul = eBul.filter(b => !b.dead);
  }

  // invaders landed
  if (aliens.some(a => a.y + 12 >= player.y - 14)) {
    lives = 0; explode(player.x, player.y, '#ff4f4f', 60, 340); noise(.7, .15); shake = 14; gameOver();
  }

  // wave cleared
  if (state === 'play' && !aliens.length && !boss) {
    clearT += dt;
    if (clearT > (isBossLevel() ? 1.8 : .4)) {
      level++;
      tone(520, .15, 'triangle', .07); setTimeout(() => tone(780, .25, 'triangle', .07), 150);
      spawnWave();
    }
  }
}

/* ---------- DRAW ---------- */
function glowText(str, x, y, size, color, align = 'center', blur = 16) {
  ctx.save(); ctx.font = `900 ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.shadowColor = color; ctx.shadowBlur = blur; ctx.fillStyle = color; ctx.fillText(str, x, y); ctx.restore();
}
function drawShip(x, y, s = 1, alpha = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.globalAlpha = alpha;
  const fl = 10 + Math.random() * 10;
  const fg = ctx.createLinearGradient(0, 12, 0, 12 + fl + 8);
  fg.addColorStop(0, '#fff'); fg.addColorStop(.4, '#ffb84f'); fg.addColorStop(1, 'rgba(255,60,0,0)');
  ctx.fillStyle = fg; ctx.beginPath(); ctx.moveTo(-6, 12); ctx.lineTo(0, 12 + fl + 8); ctx.lineTo(6, 12); ctx.fill();
  const g = ctx.createLinearGradient(-22, -22, 22, 14);
  g.addColorStop(0, '#e9fbff'); g.addColorStop(.5, '#4ff0ff'); g.addColorStop(1, '#2a6bff');
  ctx.shadowColor = '#4ff0ff'; ctx.shadowBlur = 16; ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0, -22); ctx.lineTo(7, -6); ctx.lineTo(22, 8); ctx.lineTo(22, 14); ctx.lineTo(10, 10);
  ctx.lineTo(6, 14); ctx.lineTo(-6, 14); ctx.lineTo(-10, 10); ctx.lineTo(-22, 14); ctx.lineTo(-22, 8); ctx.lineTo(-7, -6);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = '#0b1b4d'; ctx.beginPath(); ctx.ellipse(0, -2, 4, 8, 0, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#ff4fd8'; ctx.fillRect(-16, 6, 3, 5); ctx.fillRect(13, 6, 3, 5);
  ctx.restore();
}
function drawUfo(u) {
  ctx.save(); ctx.translate(u.x, u.y);
  ctx.shadowColor = '#ff4f6a'; ctx.shadowBlur = 18;
  const g = ctx.createLinearGradient(0, -10, 0, 10); g.addColorStop(0, '#ff9aa8'); g.addColorStop(1, '#b01030');
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 2, 22, 8, 0, 0, 6.283); ctx.fill();
  ctx.fillStyle = 'rgba(160,240,255,.8)'; ctx.beginPath(); ctx.ellipse(0, -3, 11, 8, 0, Math.PI, 0); ctx.fill();
  ctx.shadowBlur = 0;
  for (let i = -2; i <= 2; i++) { ctx.fillStyle = (Math.floor(time * 8) + i) % 2 ? '#ffd84f' : '#fff'; ctx.fillRect(i * 8 - 1.5, 4, 3, 3); }
  ctx.restore();
}
function drawBoss(b) {
  ctx.save(); ctx.translate(b.x, b.y);
  const fl = b.flash > 0;
  const g = ctx.createLinearGradient(0, -40, 0, 40);
  g.addColorStop(0, fl ? '#fff' : '#ff6a8a'); g.addColorStop(1, fl ? '#fff' : '#5a1030');
  ctx.shadowColor = '#ff3060'; ctx.shadowBlur = 24; ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-75, -10); ctx.lineTo(-45, -32); ctx.lineTo(-20, -38); ctx.lineTo(20, -38); ctx.lineTo(45, -32);
  ctx.lineTo(75, -10); ctx.lineTo(60, 12); ctx.lineTo(35, 10); ctx.lineTo(20, 34); ctx.lineTo(-20, 34);
  ctx.lineTo(-35, 10); ctx.lineTo(-60, 12); ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0; ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-45, -32); ctx.lineTo(-35, 10); ctx.moveTo(45, -32); ctx.lineTo(35, 10); ctx.stroke();
  const pulse = .6 + .4 * Math.sin(time * 6);
  const eg = ctx.createRadialGradient(0, -2, 2, 0, -2, 20);
  eg.addColorStop(0, '#fff'); eg.addColorStop(.4, '#ffd84f'); eg.addColorStop(1, 'rgba(255,40,40,0)');
  ctx.globalAlpha = pulse; ctx.fillStyle = eg; ctx.beginPath(); ctx.arc(0, -2, 20, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1;
  ctx.fillStyle = '#2a0818'; [-50, -25, 25, 50].forEach(x => ctx.fillRect(x - 4, 10, 8, 16));
  ctx.restore();
}
function drawDrop(d) {
  const c = PW[d.type];
  ctx.save(); ctx.translate(d.x, d.y + Math.sin(d.t * 5) * 2);
  ctx.shadowColor = c.col; ctx.shadowBlur = 16; ctx.fillStyle = '#0b0820'; ctx.strokeStyle = c.col; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(0, 0, 12, 0, 6.283); ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0; ctx.fillStyle = c.col; ctx.font = `900 14px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(c.ch, 0, 1); ctx.restore();
}
function draw() {
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  ctx.drawImage(bg, 0, 0);

  for (const s of stars) {
    ctx.globalAlpha = .45 + .55 * Math.abs(Math.sin(time * 1.5 + s.ph));
    ctx.fillStyle = '#fff'; ctx.fillRect(s.x, s.y, s.r, s.r + s.v / 30);
  }
  ctx.globalAlpha = 1;

  if (state === 'play' && banner > 0 && boss) {
    ctx.fillStyle = `rgba(255,0,40,${.08 + .08 * Math.abs(Math.sin(time * 8))})`; ctx.fillRect(0, 0, W, H);
  }

  for (const s of shields) {
    ctx.fillStyle = `hsl(${140 - (s.y - (H - 150)) * .6},90%,${48 + ((s.x + s.y) % 3) * 4}%)`;
    ctx.fillRect(s.x, s.y, s.s - .5, s.s - .5);
  }

  for (const a of aliens) {
    const sp = SPR[a.type][frame];
    ctx.drawImage(sp.c, a.x - sp.c.width / 2, a.y - sp.c.height / 2);
  }
  if (boss) drawBoss(boss);
  if (ufo) drawUfo(ufo);
  drops.forEach(drawDrop);

  // player + shield bubble
  if (state !== 'menu' && player.dead <= 0 && !(state === 'over' && lives <= 0)) {
    const blink = player.inv > 0 && Math.floor(time * 14) % 2;
    drawShip(player.x, player.y, 1, blink ? .35 : 1);
    if (power.shield) {
      const r = 34 + Math.sin(time * 6) * 1.5;
      const g = ctx.createRadialGradient(player.x, player.y, 10, player.x, player.y, r);
      g.addColorStop(0, 'rgba(79,240,255,0)'); g.addColorStop(1, 'rgba(79,240,255,.35)');
      ctx.save(); ctx.fillStyle = g; ctx.strokeStyle = 'rgba(120,250,255,.8)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(player.x, player.y, r, 0, 6.283); ctx.fill(); ctx.stroke(); ctx.restore();
    }
  }

  // bullets
  ctx.save(); ctx.shadowColor = '#7ff'; ctx.shadowBlur = 14; ctx.strokeStyle = '#eaffff'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  pBul.forEach(b => { ctx.beginPath(); ctx.moveTo(b.x, b.y - 9); ctx.lineTo(b.x - b.vx * .03, b.y + 9); ctx.stroke(); });
  ctx.restore();
  ctx.save(); ctx.shadowColor = '#ff7a3c'; ctx.shadowBlur = 14; ctx.strokeStyle = '#ffd0a0'; ctx.lineWidth = 3;
  eBul.forEach(b => {
    ctx.beginPath();
    for (let i = 0; i <= 6; i++) { const yy = b.y - 10 + i * 4; const xx = b.x + Math.sin(b.t * 25 + i) * 3; i ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); }
    ctx.stroke();
  }); ctx.restore();

  // particles / rings
  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size); }
  for (const r of rings) { ctx.globalAlpha = Math.max(0, r.life / r.max) * .7; ctx.strokeStyle = r.color; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 6.283); ctx.stroke(); }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  texts.forEach(t => { ctx.globalAlpha = Math.max(0, t.life); glowText(t.str, t.x, t.y, 18, t.color, 'center', 10); }); ctx.globalAlpha = 1;

  // HUD
  glowText('SCORE ' + String(score).padStart(5, '0'), 20, 22, 16, '#cfc4ff', 'left', 8);
  glowText('HI ' + String(hi).padStart(5, '0'), W / 2, 22, 16, '#ffd84f', 'center', 8);
  glowText('WAVE ' + level, W - 20, 22, 16, '#4ff0ff', 'right', 8);
  if (combo >= 2) {
    glowText('COMBO x' + combo, 20, 46, 14, '#ffd84f', 'left', 8);
    ctx.fillStyle = '#ffd84f'; ctx.fillRect(20, 57, 90 * Math.max(0, comboT / 1.6), 3);
  }
  if (boss) {
    const bw = 300, bx = W / 2 - bw / 2;
    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(bx, 44, bw, 8);
    ctx.save(); ctx.shadowColor = '#ff3060'; ctx.shadowBlur = 10;
    ctx.fillStyle = boss.hp < boss.max * .5 ? '#ff3060' : '#ff8aa0'; ctx.fillRect(bx, 44, bw * Math.max(0, boss.hp / boss.max), 8); ctx.restore();
  }
  for (let i = 0; i < lives; i++) drawShip(28 + i * 34, H - 16, .5);
  ctx.strokeStyle = '#6a3cff66'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, H - 30); ctx.lineTo(W, H - 30); ctx.stroke();

  // active power-up timers
  const act = [];
  if (power.triple > 0) act.push({ k: 'triple', f: power.triple / 10 });
  if (power.rapid > 0) act.push({ k: 'rapid', f: power.rapid / 8 });
  if (power.shield) act.push({ k: 'shield', f: 1 });
  let px = W - 30;
  act.forEach(a => {
    const c = PW[a.k];
    ctx.fillStyle = c.col; ctx.fillRect(px - 40, H - 12, 40 * a.f, 3);
    glowText(c.ch, px - 52, H - 14, 14, c.col, 'center', 8); px -= 80;
  });

  if (state === 'play' && banner > 0) glowText(bannerText, W / 2, H / 2 - 40, boss ? 40 : 52, boss ? '#ff4f6a' : '#4ff0ff', 'center', 24);
  if (paused) glowText('PAUSED', W / 2, H / 2, 54, '#fff');
  if (state === 'menu') {
    glowText('SPACE', W / 2, 170, 84, '#ff4fd8', 'center', 30);
    glowText('INVADERS', W / 2, 250, 70, '#4ff0ff', 'center', 30);
    [[0, 340, '30'], [1, 385, '20'], [2, 430, '10']].forEach(([t, y, p]) => {
      const s = SPR[t][Math.floor(time * 2) % 2]; ctx.drawImage(s.c, W / 2 - 80 - s.c.width / 2, y - s.c.height / 2);
      glowText('= ' + p + ' PTS', W / 2 - 20, y, 20, '#cfc4ff', 'left', 6);
    });
    glowText('T TRIPLE   R RAPID   S SHIELD   + LIFE', W / 2, 485, 13, '#ffd84f', 'center', 6);
    glowText('CHAIN KILLS FOR COMBO UP TO x5  •  BOSS EVERY 5 WAVES', W / 2, 510, 12, '#8a80c8', 'center', 4);
    if (Math.floor(time * 2) % 2) glowText('PRESS SPACE  /  TAP TO START', W / 2, 545, 20, '#ffd84f', 'center', 12);
    glowText('← → MOVE   SPACE FIRE   P PAUSE', W / 2, 577, 12, '#8a80c8', 'center', 4);
  }
  if (state === 'over') {
    ctx.fillStyle = 'rgba(5,3,15,.6)'; ctx.fillRect(0, 0, W, H);
    glowText('GAME OVER', W / 2, 220, 66, '#ff4f6a', 'center', 28);
    glowText('SCORE ' + score, W / 2, 310, 28, '#fff');
    if (score >= hi && score > 0) glowText('NEW HIGH SCORE!', W / 2, 355, 22, '#ffd84f');
    if (Math.floor(time * 2) % 2) glowText('PRESS SPACE  /  TAP TO RETRY', W / 2, 450, 20, '#4ff0ff', 'center', 12);
  }
  ctx.restore();
}

/* ---------- LOOP ---------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  if (!paused) update(dt);
  draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- INPUT ---------- */
function action() { initAudio(); if (state !== 'play') startGame(); }
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowleft', 'arrowright', ' ', 'arrowup', 'arrowdown'].includes(k)) e.preventDefault();
  if (k === 'arrowleft' || k === 'a') keys.left = true;
  if (k === 'arrowright' || k === 'd') keys.right = true;
  if (k === ' ' || k === 'enter') { keys.fire = true; action(); }
  if (k === 'p' && state === 'play') paused = !paused;
});
addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') keys.left = false;
  if (k === 'arrowright' || k === 'd') keys.right = false;
  if (k === ' ' || k === 'enter') keys.fire = false;
});
function bind(id, key) {
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); keys[key] = true; el.classList.add('on'); if (key === 'fire') action(); };
  const off = e => { e.preventDefault(); keys[key] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', on);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, off));
}
bind('bl', 'left'); bind('br', 'right'); bind('fire', 'fire');
cv.addEventListener('pointerdown', () => { if (state !== 'play') action(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') paused = true; });
})();
</script>
