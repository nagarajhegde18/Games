<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Neon Breakout</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;height:100dvh;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    font-family:'Orbitron','Segoe UI',system-ui,sans-serif;color:#fff;background:#05030f}
  body{display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 25%,#1c1145 0%,#0a0620 45%,#05030f 80%)}
  /* size is set by JS fit() so the whole game always stays visible */
  #wrap{position:relative;width:900px;height:600px;flex:none}
  canvas{width:100%;height:100%;display:block;border-radius:16px;cursor:none;
    box-shadow:0 0 70px rgba(130,90,255,.45),0 0 0 2px rgba(160,130,255,.35)}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(8px,2vw,18px);text-align:center;background:rgba(5,3,15,.62);backdrop-filter:blur(6px);border-radius:16px;z-index:3}
  #overlay.hidden{display:none}
  #title{font-size:clamp(24px,6vw,72px);font-weight:900;letter-spacing:.08em;
    background:linear-gradient(90deg,#00e5ff,#a855ff,#ff3d8b,#ffd000);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(168,85,255,.7))}
  #sub{font-size:clamp(10px,1.6vw,18px);opacity:.85;line-height:1.7;max-width:86%}
  #btn{cursor:pointer;border:0;padding:.9em 2.4em;font:700 clamp(12px,2vw,20px) 'Orbitron',sans-serif;letter-spacing:.2em;color:#fff;
    border-radius:999px;background:linear-gradient(135deg,#7c3aed,#ec4899);box-shadow:0 0 30px rgba(236,72,153,.6);transition:transform .15s}
  #btn:hover{transform:scale(1.07)}

  /* ---- Mobile controls ---- */
  .ctl{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));width:clamp(68px,19vmin,100px);height:clamp(68px,19vmin,100px);
    display:none;align-items:center;justify-content:center;border-radius:50%;
    border:2px solid rgba(190,160,255,.65);color:#fff;font-size:clamp(26px,7vmin,42px);
    background:radial-gradient(circle at 30% 25%,rgba(168,85,255,.6),rgba(30,15,80,.6));
    backdrop-filter:blur(4px);box-shadow:0 0 26px rgba(168,85,255,.55);z-index:6;touch-action:none;cursor:pointer;
    transition:transform .08s,background .08s}
  .ctl.active{transform:scale(.9);background:radial-gradient(circle at 30% 25%,rgba(236,72,153,.85),rgba(124,58,237,.7))}
  #btnL{left:max(18px,env(safe-area-inset-left))}
  #btnR{right:max(18px,env(safe-area-inset-right))}
  #pauseBtn{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));
    width:44px;height:44px;display:none;align-items:center;justify-content:center;border-radius:50%;
    border:2px solid rgba(190,160,255,.6);background:rgba(20,10,60,.6);color:#fff;font:700 16px 'Orbitron',sans-serif;z-index:6;cursor:pointer}
  @media (hover:none) and (pointer:coarse){.ctl,#pauseBtn{display:flex}}
  body.touch .ctl,body.touch #pauseBtn{display:flex}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1800" height="1200"></canvas>
  <div id="overlay">
    <div id="title">NEON BREAKOUT</div>
    <div id="sub">Move: Mouse / Touch drag / ← → / A D / on-screen arrows<br>
      Launch: Click / Tap / Space &nbsp;•&nbsp; Pause: P<br>
      Power-ups: <b>W</b> wide &nbsp;<b>M</b> multi &nbsp;<b>S</b> slow &nbsp;<b>L</b> lasers &nbsp;<b>F</b> fireball &nbsp;<b>♥</b> life</div>
    <button id="btn">START</button>
  </div>
</div>

<button class="ctl" id="btnL" aria-label="Move left">◀</button>
<button class="ctl" id="btnR" aria-label="Move right">▶</button>
<button id="pauseBtn" aria-label="Pause">II</button>

<script>
(() => {
  const W = 900, H = 600, HUD = 48;
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  ctx.setTransform(2,0,0,2,0,0);
  const overlay = document.getElementById('overlay'), btn = document.getElementById('btn');
  const $title = document.getElementById('title'), $sub = document.getElementById('sub');
  const wrapEl = document.getElementById('wrap');
  if ('ontouchstart' in window || navigator.maxTouchPoints > 0) document.body.classList.add('touch');

  const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
  const rand = (a,b)=>a+Math.random()*(b-a);
  const rr = (x,y,w,h,r)=>{ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();};

  /* ---------- Fit game to available space (fixes cut-off bottom) ---------- */
  function fit(){
    const parent = wrapEl.parentElement;
    const top = Math.max(0, parent.getBoundingClientRect().top);   // space used by any site header above
    const vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
    const availH = Math.max(240, vh - top - 10);
    const availW = Math.max(240, (parent.clientWidth || window.innerWidth) - 8);
    const scale = Math.min(availW / W, availH / H);
    wrapEl.style.width  = Math.floor(W * scale) + 'px';
    wrapEl.style.height = Math.floor(H * scale) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', () => setTimeout(fit, 200));
  document.addEventListener('fullscreenchange', () => setTimeout(fit, 100));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
  window.addEventListener('load', fit);

  /* ---------- Audio ---------- */
  let actx = null;
  function beep(f=440,d=.08,type='sine',v=.08,slide=0){
    if(!actx) return;
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,actx.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),actx.currentTime+d);
    g.gain.setValueAtTime(v,actx.currentTime); g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+d);
  }
  const sfx = {
    wall:()=>beep(220,.05,'triangle',.06),
    paddle:()=>beep(330,.09,'square',.05,120),
    brick:(c)=>beep(500+Math.min(c,12)*45,.1,'sine',.09,200),
    hard:()=>beep(180,.07,'square',.05),
    laser:()=>beep(900,.07,'sawtooth',.035,-500),
    power:()=>{beep(600,.1,'triangle',.08,400);setTimeout(()=>beep(900,.12,'triangle',.08),90)},
    lose:()=>beep(300,.5,'sawtooth',.09,-250),
    clear:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.18,'triangle',.09),i*110))
  };

  /* ---------- State ---------- */
  let state='menu', score=0, lives=3, level=0, combo=0, time=0, shake=0, clearTimer=0;
  let best = +localStorage.getItem('neonBreakoutBest')||0;
  let balls=[], bricks=[], powerups=[], particles=[], rings=[], texts=[], lasers=[];
  let wideT=0, slowT=0, laserT=0, fireT=0, laserCd=0;
  const paddle = {x:W/2, y:H-42, w:120, tw:120, h:16};
  let targetX = W/2;
  const keys = {left:false,right:false};

  const stars = Array.from({length:110},()=>({x:rand(0,W),y:rand(0,H),z:rand(.2,1),t:rand(0,6)}));

  /* ---------- Levels ---------- */
  const COLS=12, ROWS=8, BM=30, BG=6, BH=24, BTOP=95;
  const BW=(W-BM*2-BG*(COLS-1))/COLS;
  const patterns=[
    ()=>1,
    (r,c)=>(r+c)%2?0:(r<2?2:1),
    (r,c)=>(c>=r&&c<COLS-r)?(r===0?2:1):0,
    (r,c)=>Math.abs(c-5.5)+Math.abs(r-3.5)<=5.5?((r+c)%3===0?2:1):0,
    (r)=>r%2===0?2:1,
    (r,c)=>(c%3===1)?0:(r<3?3:1)
  ];
  function buildLevel(){
    bricks=[];
    const p=patterns[level%patterns.length], bonus=Math.floor(level/patterns.length);
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      let hp=p(r,c); if(!hp) continue; hp=Math.min(3,hp+bonus);
      bricks.push({x:BM+c*(BW+BG),y:BTOP+r*(BH+BG),w:BW,h:BH,hp,max:hp,
        hue:(190+r*38+level*25)%360,flash:0,t:-(r*.09+c*.03),alive:true});
    }
  }
  function newBall(){return{x:paddle.x,y:paddle.y-9,vx:0,vy:0,r:8,stuck:true,trail:[]}}
  const baseSpeed=()=>Math.min(10,6+level*.35)*(slowT>0?.7:1);
  function resetPowers(){wideT=slowT=laserT=fireT=0;laserCd=0;paddle.tw=120;lasers=[];}

  function loadLevel(){
    buildLevel(); balls=[newBall()]; powerups=[]; combo=0; resetPowers(); state='ready';
  }
  function startGame(){
    score=0;lives=3;level=0; particles=[];rings=[];texts=[];
    loadLevel(); overlay.classList.add('hidden'); fit();
  }

  /* ---------- Effects ---------- */
  function burst(x,y,hue,n=18,spd=5){
    for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),s=rand(1,spd);
      particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(25,50),max:50,size:rand(1.5,4),hue});}
    rings.push({x,y,r:4,life:1,hue});
  }
  function floatText(x,y,str,color='#fff'){texts.push({x,y,str,color,life:1});}

  /* ---------- Power-ups ---------- */
  const PU={
    W:{c:'#22d3ee',name:'WIDE PADDLE',run:()=>{wideT=720;paddle.tw=190}},
    M:{c:'#f472b6',name:'MULTI-BALL',run:()=>{const add=[];balls.forEach(b=>{if(b.stuck)return;
        for(const da of[-.5,.5]){const a=Math.atan2(b.vy,b.vx)+da,s=Math.hypot(b.vx,b.vy)||6;
          add.push({x:b.x,y:b.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:8,stuck:false,trail:[]});}});
      balls.push(...add.slice(0,4)); if(balls.length>8)balls.length=8;}},
    S:{c:'#facc15',name:'SLOW BALL',run:()=>{slowT=600}},
    L:{c:'#fb7185',name:'LASERS!',run:()=>{laserT=600;laserCd=0}},
    F:{c:'#fb923c',name:'FIREBALL!',run:()=>{fireT=480}},
    '♥':{c:'#ef4444',name:'EXTRA LIFE',run:()=>{lives=Math.min(5,lives+1)}}
  };
  const DROP_POOL=['W','M','S','W','M','L','F','♥'];
  function maybeDrop(b){
    if(Math.random()<.16)powerups.push({x:b.x+b.w/2,y:b.y,type:DROP_POOL[Math.floor(Math.random()*DROP_POOL.length)]});
  }

  /* ---------- Game logic ---------- */
  function launch(){
    if(state!=='ready')return;
    balls.forEach(b=>{if(b.stuck){b.stuck=false;const a=-Math.PI/2+rand(-.3,.3),s=baseSpeed();
      b.vx=Math.cos(a)*s;b.vy=Math.sin(a)*s;}});
    state='play'; beep(440,.12,'triangle',.07,300);
  }

  function hitBrick(b){
    b.hp--; b.flash=1; combo++;
    const mult=1+Math.floor(combo/4);
    if(b.hp<=0){
      b.alive=false; const pts=50*b.max*mult; score+=pts;
      burst(b.x+b.w/2,b.y+b.h/2,b.hue,22,6); shake=Math.min(8,shake+3);
      floatText(b.x+b.w/2,b.y,'+'+pts,`hsl(${b.hue},100%,75%)`); maybeDrop(b); sfx.brick(combo);
      if(score>best){best=score;localStorage.setItem('neonBreakoutBest',best);}
    } else { burst(b.x+b.w/2,b.y+b.h/2,b.hue,7,3); score+=10; sfx.hard(); shake=Math.min(8,shake+1); }
  }

  function collide(b){
    if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx);sfx.wall();}
    else if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx);sfx.wall();}
    if(b.y<HUD+b.r){b.y=HUD+b.r;b.vy=Math.abs(b.vy);sfx.wall();}
    const px=paddle.x-paddle.w/2;
    if(b.vy>0&&b.y+b.r>=paddle.y&&b.y-b.r<paddle.y+paddle.h&&b.x>px-b.r&&b.x<px+paddle.w+b.r){
      const hit=clamp((b.x-paddle.x)/(paddle.w/2),-1,1), a=hit*1.05, s=Math.hypot(b.vx,b.vy);
      b.vx=Math.sin(a)*s; b.vy=-Math.cos(a)*s; b.y=paddle.y-b.r;
      combo=0; sfx.paddle(); burst(b.x,paddle.y,200,6,3); shake=Math.min(8,shake+1);
    }
    for(const k of bricks){
      if(!k.alive||k.t<1)continue;
      const cx=clamp(b.x,k.x,k.x+k.w), cy=clamp(b.y,k.y,k.y+k.h), dx=b.x-cx, dy=b.y-cy;
      if(dx*dx+dy*dy<b.r*b.r){
        if(fireT>0){ k.hp=1; hitBrick(k); continue; }   // fireball: smash through
        if(dx===0&&dy===0) b.vy=-b.vy;
        else if(Math.abs(dx)>Math.abs(dy)) b.vx=Math.sign(dx)*Math.abs(b.vx);
        else b.vy=Math.sign(dy)*Math.abs(b.vy);
        hitBrick(k); break;
      }
    }
  }

  function loseLife(){
    lives--; sfx.lose(); shake=12; combo=0;
    if(lives<=0){
      state='over'; $title.textContent='GAME OVER';
      $sub.innerHTML=`Score: <b>${score}</b> &nbsp;•&nbsp; Best: <b>${best}</b>`; btn.textContent='PLAY AGAIN';
      overlay.classList.remove('hidden');
    } else { balls=[newBall()]; resetPowers(); state='ready'; }
  }

  function update(dt){
    time+=dt;
    stars.forEach(s=>{s.y+=s.z*.35*dt;if(s.y>H){s.y=0;s.x=rand(0,W);}});
    if(state==='menu'||state==='paused'||state==='over')return;

    if(keys.left)targetX-=11*dt; if(keys.right)targetX+=11*dt;
    targetX=clamp(targetX,paddle.w/2,W-paddle.w/2);
    paddle.w+=(paddle.tw-paddle.w)*.15*dt;
    paddle.x+=(targetX-paddle.x)*Math.min(1,.5*dt);
    paddle.x=clamp(paddle.x,paddle.w/2,W-paddle.w/2);

    if(wideT>0){wideT-=dt;if(wideT<=0)paddle.tw=120;}
    if(slowT>0)slowT-=dt;
    if(laserT>0)laserT-=dt;
    if(fireT>0)fireT-=dt;

    for(const b of balls){
      if(b.stuck){b.x=paddle.x;b.y=paddle.y-b.r-1;b.trail.length=0;continue;}
      const sp=baseSpeed(),m=Math.hypot(b.vx,b.vy)||1;
      b.vx*=sp/m;b.vy*=sp/m;
      if(Math.abs(b.vy)<sp*.25){b.vy=Math.sign(b.vy||-1)*sp*.25;}
      const steps=Math.ceil(sp*dt/3),sdt=dt/steps;
      for(let i=0;i<steps;i++){b.x+=b.vx*sdt;b.y+=b.vy*sdt;collide(b);}
      b.trail.push({x:b.x,y:b.y}); if(b.trail.length>14)b.trail.shift();
      if(fireT>0&&Math.random()<.9)
        particles.push({x:b.x+rand(-3,3),y:b.y+rand(-3,3),vx:rand(-.7,.7),vy:rand(-.7,.7),life:rand(14,28),max:28,size:rand(2,4.5),hue:rand(5,50)});
    }
    if(state==='play'){
      balls=balls.filter(b=>b.y<H+30);
      if(balls.length===0)loseLife();
    }

    // lasers
    if(state==='play'&&laserT>0){
      laserCd-=dt;
      if(laserCd<=0){laserCd=14;
        lasers.push({x:paddle.x-paddle.w/2+14,y:paddle.y},{x:paddle.x+paddle.w/2-14,y:paddle.y});sfx.laser();}
    }
    if(state==='play'){
      for(const l of lasers){
        l.y-=13*dt;
        if(l.y<HUD){l.dead=true;continue;}
        for(const k of bricks){
          if(!k.alive||k.t<1)continue;
          if(l.x>k.x&&l.x<k.x+k.w&&l.y>k.y&&l.y<k.y+k.h){hitBrick(k);l.dead=true;burst(l.x,l.y,350,5,3);break;}
        }
      }
      lasers=lasers.filter(l=>!l.dead);
    }

    // power-ups
    for(const p of powerups){
      p.y+=3*dt;
      if(p.y>paddle.y-6&&p.y<paddle.y+paddle.h+14&&Math.abs(p.x-paddle.x)<paddle.w/2+16){
        p.dead=true; PU[p.type].run(); sfx.power(); burst(p.x,p.y,50,14,5); floatText(p.x,p.y-14,PU[p.type].name,PU[p.type].c);
      }
      if(p.y>H+20)p.dead=true;
    }
    powerups=powerups.filter(p=>!p.dead);

    bricks.forEach(b=>{if(b.t<1)b.t+=.04*dt; if(b.flash>0)b.flash-=.08*dt;});

    if(state==='play'&&bricks.every(b=>!b.alive)){
      state='clear'; clearTimer=110; sfx.clear(); score+=500*(level+1); lasers=[];
      floatText(W/2,H/2,'LEVEL CLEAR!','#fff'); burst(W/2,H/2,rand(0,360),60,9);
    }
    if(state==='clear'){clearTimer-=dt; if(clearTimer<=0){level++;loadLevel();}}

    particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.08*dt;p.vx*=.99;p.life-=dt;});
    particles=particles.filter(p=>p.life>0);
    rings.forEach(r=>{r.r+=3.2*dt;r.life-=.04*dt;}); rings=rings.filter(r=>r.life>0);
    texts.forEach(t=>{t.y-=.8*dt;t.life-=.015*dt;}); texts=texts.filter(t=>t.life>0);
    shake*=Math.pow(.88,dt); if(shake<.1)shake=0;
  }

  /* ---------- Rendering ---------- */
  function drawBG(){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#150b3a');g.addColorStop(.6,'#0b0626');g.addColorStop(1,'#05030f');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    for(let i=0;i<3;i++){
      const x=W/2+Math.sin(time*.01+i*2)*280,y=H/2+Math.cos(time*.013+i*3)*150;
      const rg=ctx.createRadialGradient(x,y,0,x,y,260);
      rg.addColorStop(0,`hsla(${260+i*40},90%,55%,.14)`);rg.addColorStop(1,'transparent');
      ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
    }
    stars.forEach(s=>{ctx.globalAlpha=.35+.65*Math.abs(Math.sin(time*.03+s.t));
      ctx.fillStyle='#fff';ctx.fillRect(s.x,s.y,s.z*2,s.z*2);});
    ctx.globalAlpha=1;
    ctx.strokeStyle='rgba(140,100,255,.07)';ctx.lineWidth=1;
    for(let x=0;x<=W;x+=50){ctx.beginPath();ctx.moveTo(x,HUD);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=HUD;y<=H;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  }

  function drawBrick(b){
    if(!b.alive||b.t<=0)return;
    const e=Math.min(1,b.t), ease=1-Math.pow(1-e,3), y=b.y-(1-ease)*30;
    ctx.save(); ctx.globalAlpha=ease;
    const L=50+(b.hp>1?8:0);
    ctx.shadowColor=`hsla(${b.hue},100%,60%,.85)`;ctx.shadowBlur=14;
    const g=ctx.createLinearGradient(0,y,0,y+b.h);
    g.addColorStop(0,`hsl(${b.hue},95%,${L+16}%)`);g.addColorStop(1,`hsl(${b.hue},90%,${L-16}%)`);
    ctx.fillStyle=g;rr(b.x,y,b.w,b.h,6);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,.3)';rr(b.x+3,y+2,b.w-6,b.h*.38,4);ctx.fill();
    if(b.max>1){
      ctx.strokeStyle=`rgba(255,255,255,${.35+.3*b.hp/b.max})`;ctx.lineWidth=2;rr(b.x+1,y+1,b.w-2,b.h-2,6);ctx.stroke();
      for(let i=0;i<b.hp;i++){ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();
        ctx.arc(b.x+b.w/2-(b.hp-1)*5+i*10,y+b.h/2+3,2,0,7);ctx.fill();}
    }
    if(b.flash>0){ctx.fillStyle=`rgba(255,255,255,${b.flash*.7})`;rr(b.x,y,b.w,b.h,6);ctx.fill();}
    ctx.restore();
  }

  function drawPaddle(){
    const x=paddle.x-paddle.w/2,y=paddle.y;
    ctx.save();
    ctx.shadowColor=laserT>0?'#fb7185':'#22d3ee';ctx.shadowBlur=24;
    const g=ctx.createLinearGradient(x,0,x+paddle.w,0);
    g.addColorStop(0,'#7c3aed');g.addColorStop(.5,'#22d3ee');g.addColorStop(1,'#ec4899');
    ctx.fillStyle=g;rr(x,y,paddle.w,paddle.h,paddle.h/2);ctx.fill();
    ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,.45)';rr(x+8,y+2,paddle.w-16,5,3);ctx.fill();
    if(laserT>0){
      ctx.fillStyle='#fecdd3';ctx.shadowColor='#fb7185';ctx.shadowBlur=14;
      rr(x+10,y-8,8,12,3);ctx.fill();rr(x+paddle.w-18,y-8,8,12,3);ctx.fill();
    }
    ctx.restore();
    const ug=ctx.createRadialGradient(paddle.x,y+paddle.h,0,paddle.x,y+paddle.h,paddle.w*.7);
    ug.addColorStop(0,'rgba(34,211,238,.25)');ug.addColorStop(1,'transparent');
    ctx.fillStyle=ug;ctx.fillRect(x-40,y,paddle.w+80,50);
  }

  function drawLasers(){
    ctx.save();ctx.shadowColor='#fb7185';ctx.shadowBlur=14;ctx.lineCap='round';
    for(const l of lasers){
      ctx.strokeStyle='#ffe4e6';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(l.x,l.y);ctx.lineTo(l.x,l.y+16);ctx.stroke();
      ctx.strokeStyle='#fb7185';ctx.lineWidth=6;ctx.globalAlpha=.35;
      ctx.beginPath();ctx.moveTo(l.x,l.y);ctx.lineTo(l.x,l.y+16);ctx.stroke();ctx.globalAlpha=1;
    }
    ctx.restore();
  }

  function drawBall(b){
    const fire=fireT>0;
    for(let i=0;i<b.trail.length;i++){
      const t=b.trail[i],k=i/b.trail.length;
      ctx.fillStyle=fire?`rgba(255,140,40,${k*.4})`:`rgba(120,220,255,${k*.35})`;
      ctx.beginPath();ctx.arc(t.x,t.y,b.r*k,0,7);ctx.fill();
    }
    const gl=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r*(fire?5:3.5));
    gl.addColorStop(0,fire?'rgba(255,220,120,.9)':'rgba(180,240,255,.8)');
    gl.addColorStop(.3,fire?'rgba(255,100,20,.4)':'rgba(80,180,255,.3)');gl.addColorStop(1,'transparent');
    ctx.fillStyle=gl;ctx.beginPath();ctx.arc(b.x,b.y,b.r*(fire?5:3.5),0,7);ctx.fill();
    const g=ctx.createRadialGradient(b.x-2,b.y-2,1,b.x,b.y,b.r);
    g.addColorStop(0,'#fff');g.addColorStop(1,fire?'#fb923c':'#7dd3fc');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();
  }

  function drawPU(p){
    const c=PU[p.type].c;
    ctx.save();ctx.shadowColor=c;ctx.shadowBlur=16;
    ctx.fillStyle=c;rr(p.x-16,p.y-10,32,20,10);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='#0a0620';ctx.font='700 13px Orbitron, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(p.type,p.x,p.y+1);ctx.restore();
  }

  function drawHUD(){
    ctx.fillStyle='rgba(10,6,32,.85)';ctx.fillRect(0,0,W,HUD);
    ctx.fillStyle='rgba(160,130,255,.4)';ctx.fillRect(0,HUD-1,W,1);
    ctx.textBaseline='middle';ctx.font='700 16px Orbitron, sans-serif';
    ctx.textAlign='left';ctx.fillStyle='#e9d5ff';ctx.fillText('SCORE '+score,20,HUD/2);
    ctx.textAlign='center';ctx.fillStyle='#67e8f9';ctx.fillText('LEVEL '+(level+1)+'   BEST '+best,W/2,HUD/2);
    ctx.textAlign='right';ctx.fillStyle='#fb7185';ctx.fillText('♥'.repeat(lives),W-(document.body.classList.contains('touch')?64:20),HUD/2);
    if(combo>=4){ctx.textAlign='left';ctx.fillStyle='#facc15';ctx.font='700 12px Orbitron, sans-serif';
      ctx.fillText('COMBO x'+(1+Math.floor(combo/4)),20,HUD+16);}
    const st=[];if(wideT>0)st.push('WIDE');if(slowT>0)st.push('SLOW');if(laserT>0)st.push('LASER');if(fireT>0)st.push('FIRE');
    if(st.length){ctx.textAlign='right';ctx.font='700 11px Orbitron, sans-serif';ctx.fillStyle='#a5f3fc';
      ctx.fillText(st.join('  '),W-20,HUD+16);}
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    drawBG();
    ctx.save();
    if(shake>0)ctx.translate(rand(-shake,shake),rand(-shake,shake));
    bricks.forEach(drawBrick);
    powerups.forEach(drawPU);
    rings.forEach(r=>{ctx.strokeStyle=`hsla(${r.hue},100%,70%,${r.life*.6})`;ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.stroke();});
    ctx.globalCompositeOperation='lighter';
    particles.forEach(p=>{ctx.fillStyle=`hsla(${p.hue},100%,60%,${Math.max(0,p.life/p.max)})`;
      ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill();});
    ctx.globalCompositeOperation='source-over';
    drawLasers();
    balls.forEach(drawBall);
    drawPaddle();
    texts.forEach(t=>{ctx.globalAlpha=Math.max(0,t.life);ctx.fillStyle=t.color;ctx.font='900 18px Orbitron, sans-serif';
      ctx.textAlign='center';ctx.shadowColor=t.color;ctx.shadowBlur=10;ctx.fillText(t.str,t.x,t.y);ctx.shadowBlur=0;});
    ctx.globalAlpha=1;
    ctx.restore();
    drawHUD();
    if(state==='ready'){ctx.textAlign='center';ctx.fillStyle=`rgba(255,255,255,${.5+.4*Math.sin(time*.1)})`;
      ctx.font='700 16px Orbitron, sans-serif';ctx.fillText('CLICK / TAP / SPACE TO LAUNCH',W/2,H/2+80);}
    const v=ctx.createRadialGradient(W/2,H/2,H*.4,W/2,H/2,H*.95);
    v.addColorStop(0,'transparent');v.addColorStop(1,'rgba(0,0,0,.5)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  }

  /* ---------- Loop ---------- */
  let last=performance.now();
  function frame(now){
    const dt=Math.min((now-last)/16.667,2.5);last=now;
    update(dt);draw();requestAnimationFrame(frame);
  }

  /* ---------- Input ---------- */
  const onCtl=e=>e.target.closest&&e.target.closest('.ctl,#pauseBtn');
  function setTarget(clientX){
    const r=cv.getBoundingClientRect();targetX=(clientX-r.left)*(W/r.width);
  }
  function initAudio(){
    if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
    if(actx&&actx.state==='suspended')actx.resume();
  }
  function togglePause(){
    if(state==='play'||state==='ready'){
      state='paused';$title.textContent='PAUSED';$sub.innerHTML='Press P or tap Resume';
      btn.textContent='RESUME';overlay.classList.remove('hidden');
    } else if(state==='paused'){resume();}
  }
  function resume(){
    overlay.classList.add('hidden');
    state=balls.some(b=>b.stuck)?'ready':'play';
  }

  window.addEventListener('mousemove',e=>{if(!onCtl(e))setTarget(e.clientX);});
  window.addEventListener('touchstart',e=>{if(!onCtl(e))setTarget(e.touches[0].clientX);},{passive:true});
  window.addEventListener('touchmove',e=>{e.preventDefault();if(!onCtl(e))setTarget(e.touches[0].clientX);},{passive:false});
  cv.addEventListener('mousedown',()=>{initAudio();launch();});
  cv.addEventListener('touchend',()=>{initAudio();launch();});
  window.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=true;
    if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=true;
    if(e.code==='Space'){e.preventDefault();initAudio();launch();}
    if(e.key==='p'||e.key==='P'||e.key==='Escape')togglePause();
  });
  window.addEventListener('keyup',e=>{
    if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=false;
    if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=false;
  });
  btn.addEventListener('click',()=>{initAudio();if(state==='paused')resume();else startGame();});

  // On-screen arrow buttons (hold to move)
  function bindCtl(id,dir){
    const el=document.getElementById(id);
    const on=e=>{e.preventDefault();initAudio();keys[dir]=true;el.classList.add('active');
      if(el.setPointerCapture)try{el.setPointerCapture(e.pointerId)}catch(_){}};
    const off=()=>{keys[dir]=false;el.classList.remove('active');};
    el.addEventListener('pointerdown',on);
    ['pointerup','pointercancel','lostpointercapture'].forEach(n=>el.addEventListener(n,off));
    el.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
    el.addEventListener('contextmenu',e=>e.preventDefault());
  }
  bindCtl('btnL','left');bindCtl('btnR','right');
  const pb=document.getElementById('pauseBtn');
  pb.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
  pb.addEventListener('click',()=>{initAudio();togglePause();});

  buildLevel();
  fit();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
