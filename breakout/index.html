<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Neon Breakout</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;height:100dvh;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    font-family:'Orbitron','Segoe UI',system-ui,sans-serif;color:#fff;background:#05030f}
  body{display:flex;align-items:center;justify-content:center;background:#07041a}
  #wrap{position:relative;width:900px;height:600px;flex:none}
  canvas{width:100%;height:100%;display:block;border-radius:16px;cursor:none;
    box-shadow:0 0 40px rgba(130,90,255,.35),0 0 0 2px rgba(160,130,255,.35)}
  body.touch canvas{box-shadow:0 0 0 2px rgba(160,130,255,.35)}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(8px,2vw,18px);text-align:center;background:rgba(5,3,15,.82);border-radius:16px;z-index:3}
  #overlay.hidden{display:none}
  #title{font-size:clamp(24px,6vw,72px);font-weight:900;letter-spacing:.08em;
    background:linear-gradient(90deg,#00e5ff,#a855ff,#ff3d8b,#ffd000);-webkit-background-clip:text;background-clip:text;color:transparent}
  #sub{font-size:clamp(10px,1.6vw,18px);opacity:.85;line-height:1.7;max-width:86%}
  #btn{cursor:pointer;border:0;padding:.9em 2.4em;font:700 clamp(12px,2vw,20px) 'Orbitron',sans-serif;letter-spacing:.2em;color:#fff;
    border-radius:999px;background:linear-gradient(135deg,#7c3aed,#ec4899);box-shadow:0 0 24px rgba(236,72,153,.55)}

  /* ---- Mobile controls ---- */
  .ctl{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));width:clamp(68px,19vmin,100px);height:clamp(68px,19vmin,100px);
    display:none;align-items:center;justify-content:center;border-radius:50%;
    border:2px solid rgba(190,160,255,.65);color:#fff;font-size:clamp(26px,7vmin,42px);
    background:radial-gradient(circle at 30% 25%,rgba(168,85,255,.7),rgba(30,15,80,.75));
    z-index:6;touch-action:none;cursor:pointer}
  .ctl.active{transform:scale(.92);background:radial-gradient(circle at 30% 25%,rgba(236,72,153,.9),rgba(124,58,237,.8))}
  #btnL{left:max(18px,env(safe-area-inset-left))}
  #btnR{right:max(18px,env(safe-area-inset-right))}
  #pauseBtn{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));
    width:44px;height:44px;display:none;align-items:center;justify-content:center;border-radius:50%;
    border:2px solid rgba(190,160,255,.6);background:rgba(20,10,60,.75);color:#fff;font:700 16px 'Orbitron',sans-serif;z-index:6;cursor:pointer}
  @media (hover:none) and (pointer:coarse){.ctl,#pauseBtn{display:flex}}
  body.touch .ctl,body.touch #pauseBtn{display:flex}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="900" height="600"></canvas>
  <div id="overlay">
    <div id="title">NEON BREAKOUT</div>
    <div id="sub">Move: Mouse / Touch drag / ← → / A D / on-screen arrows<br>
      Launch: Click / Tap / Space &nbsp;•&nbsp; Pause: P<br>
      Power-ups: <b>W</b> wide &nbsp;<b>M</b> multi &nbsp;<b>S</b> slow &nbsp;<b>L</b> lasers &nbsp;<b>F</b> fireball &nbsp;<b>♥</b> life</div>
    <button id="btn">START</button>
  </div>
</div>

<button class="ctl" id="btnL" aria-label="Move left">◀</button>
<button class="ctl" id="btnR" aria-label="Move right">▶</button>
<button id="pauseBtn" aria-label="Pause">II</button>

<script>
(() => {
  const W = 900, H = 600, HUD = 48;
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  if (isTouch) document.body.classList.add('touch');

  /* Lower internal resolution on phones = much smoother */
  const DPR = window.devicePixelRatio || 1;
  const S = isTouch ? Math.min(DPR, 1.5) : Math.min(DPR, 2);
  const cv = document.getElementById('c');
  cv.width = Math.round(W * S); cv.height = Math.round(H * S);
  const ctx = cv.getContext('2d', { alpha: false });
  ctx.setTransform(S, 0, 0, S, 0, 0);

  const overlay = document.getElementById('overlay'), btn = document.getElementById('btn');
  const $title = document.getElementById('title'), $sub = document.getElementById('sub');
  const wrapEl = document.getElementById('wrap');

  const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
  const rand = (a,b)=>a+Math.random()*(b-a);
  const rr = (g,x,y,w,h,r)=>{g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);
    g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();};
  const compact=(arr,keep)=>{let j=0;for(let i=0;i<arr.length;i++){if(keep(arr[i]))arr[j++]=arr[i];}arr.length=j;};
  function makeCanvas(w,h){
    const c=document.createElement('canvas');c.width=Math.ceil(w*S);c.height=Math.ceil(h*S);
    const g=c.getContext('2d');g.setTransform(S,0,0,S,0,0);return [c,g];
  }

  /* ---------- Fit game to available space ---------- */
  function fit(){
    const parent = wrapEl.parentElement;
    const top = Math.max(0, parent.getBoundingClientRect().top);
    const vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
    const availH = Math.max(240, vh - top - 10);
    const availW = Math.max(240, (parent.clientWidth || window.innerWidth) - 8);
    const scale = Math.min(availW / W, availH / H);
    wrapEl.style.width  = Math.floor(W * scale) + 'px';
    wrapEl.style.height = Math.floor(H * scale) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', () => setTimeout(fit, 200));
  document.addEventListener('fullscreenchange', () => setTimeout(fit, 100));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
  window.addEventListener('load', fit);

  /* ---------- Audio ---------- */
  let actx = null;
  function beep(f=440,d=.08,type='sine',v=.08,slide=0){
    if(!actx) return;
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,actx.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),actx.currentTime+d);
    g.gain.setValueAtTime(v,actx.currentTime); g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+d);
  }
  const sfx = {
    wall:()=>beep(220,.05,'triangle',.06),
    paddle:()=>beep(330,.09,'square',.05,120),
    brick:(c)=>beep(500+Math.min(c,12)*45,.1,'sine',.09,200),
    hard:()=>beep(180,.07,'square',.05),
    laser:()=>beep(900,.07,'sawtooth',.03,-500),
    power:()=>{beep(600,.1,'triangle',.08,400);setTimeout(()=>beep(900,.12,'triangle',.08),90)},
    lose:()=>beep(300,.5,'sawtooth',.09,-250),
    clear:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.18,'triangle',.09),i*110))
  };

  /* ---------- State ---------- */
  let state='menu', score=0, lives=3, level=0, combo=0, time=0, shake=0, clearTimer=0;
  let best = +localStorage.getItem('neonBreakoutBest')||0;
  const balls=[], bricks=[], powerups=[], particles=[], rings=[], texts=[], lasers=[];
  let ballsArr=balls; // alias kept simple
  let wideT=0, slowT=0, laserT=0, fireT=0, laserCd=0;
  const paddle = {x:W/2, y:H-42, w:120, tw:120, h:16};
  let targetX = W/2;
  const keys = {left:false,right:false};
  const MAX_PARTICLES = isTouch ? 110 : 220;

  const stars = Array.from({length:isTouch?45:90},()=>({x:rand(0,W),y:rand(0,H),z:rand(.2,1)}));

  /* ---------- Pre-rendered sprites (this is what removes the lag) ---------- */
  // Background (gradient, soft orbs, grid, vignette) drawn ONCE
  const [bgCanvas,bgg]=makeCanvas(W,H);
  (function bakeBG(){
    const g=bgg.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#150b3a');g.addColorStop(.6,'#0b0626');g.addColorStop(1,'#05030f');
    bgg.fillStyle=g;bgg.fillRect(0,0,W,H);
    [[220,220,300,265],[680,300,300,300],[450,480,280,230]].forEach(([x,y,r,h])=>{
      const rg=bgg.createRadialGradient(x,y,0,x,y,r);
      rg.addColorStop(0,`hsla(${h},90%,55%,.16)`);rg.addColorStop(1,'transparent');
      bgg.fillStyle=rg;bgg.fillRect(0,0,W,H);
    });
    bgg.strokeStyle='rgba(140,100,255,.07)';bgg.lineWidth=1;bgg.beginPath();
    for(let x=0;x<=W;x+=50){bgg.moveTo(x,HUD);bgg.lineTo(x,H);}
    for(let y=HUD;y<=H;y+=50){bgg.moveTo(0,y);bgg.lineTo(W,y);}
    bgg.stroke();
    const v=bgg.createRadialGradient(W/2,H/2,H*.4,W/2,H/2,H*.95);
    v.addColorStop(0,'transparent');v.addColorStop(1,'rgba(0,0,0,.45)');
    bgg.fillStyle=v;bgg.fillRect(0,0,W,H);
  })();

  // Brick sprites cached by hue/hp
  const COLS=12, ROWS=8, BM=30, BG=6, BH=24, BTOP=95, PAD=14;
  const BW=(W-BM*2-BG*(COLS-1))/COLS;
  const brickCache=new Map();
  function brickSprite(b){
    const key=b.hue+'|'+b.hp+'|'+b.max;
    let c=brickCache.get(key); if(c)return c;
    const [cv2,g]=makeCanvas(BW+PAD*2,BH+PAD*2);
    const L=50+(b.hp>1?8:0);
    g.shadowColor=`hsla(${b.hue},100%,60%,.85)`;g.shadowBlur=12;
    const gr=g.createLinearGradient(0,PAD,0,PAD+BH);
    gr.addColorStop(0,`hsl(${b.hue},95%,${L+16}%)`);gr.addColorStop(1,`hsl(${b.hue},90%,${L-16}%)`);
    g.fillStyle=gr;rr(g,PAD,PAD,BW,BH,6);g.fill();
    g.shadowBlur=0;
    g.fillStyle='rgba(255,255,255,.3)';rr(g,PAD+3,PAD+2,BW-6,BH*.38,4);g.fill();
    if(b.max>1){
      g.strokeStyle=`rgba(255,255,255,${.35+.3*b.hp/b.max})`;g.lineWidth=2;rr(g,PAD+1,PAD+1,BW-2,BH-2,6);g.stroke();
      g.fillStyle='rgba(255,255,255,.9)';
      for(let i=0;i<b.hp;i++){g.beginPath();g.arc(PAD+BW/2-(b.hp-1)*5+i*10,PAD+BH/2+3,2,0,7);g.fill();}
    }
    brickCache.set(key,cv2);return cv2;
  }

  // Ball sprites (normal + fireball)
  function bakeBall(fire){
    const R=8*(fire?5:3.5);
    const [c,g]=makeCanvas(R*2,R*2);
    const gl=g.createRadialGradient(R,R,0,R,R,R);
    gl.addColorStop(0,fire?'rgba(255,220,120,.9)':'rgba(180,240,255,.8)');
    gl.addColorStop(.3,fire?'rgba(255,100,20,.4)':'rgba(80,180,255,.3)');gl.addColorStop(1,'transparent');
    g.fillStyle=gl;g.beginPath();g.arc(R,R,R,0,7);g.fill();
    const core=g.createRadialGradient(R-2,R-2,1,R,R,8);
    core.addColorStop(0,'#fff');core.addColorStop(1,fire?'#fb923c':'#7dd3fc');
    g.fillStyle=core;g.beginPath();g.arc(R,R,8,0,7);g.fill();
    return {c,R};
  }
  const ballSpr=bakeBall(false), fireSpr=bakeBall(true);

  // Power-up sprites
  const puCache={};
  function puSprite(type){
    if(puCache[type])return puCache[type];
    const P=16,col=PU[type].c;
    const [c,g]=makeCanvas(32+P*2,20+P*2);
    g.shadowColor=col;g.shadowBlur=12;g.fillStyle=col;rr(g,P,P,32,20,10);g.fill();g.shadowBlur=0;
    g.fillStyle='#0a0620';g.font='700 13px Orbitron, sans-serif';g.textAlign='center';g.textBaseline='middle';
    g.fillText(type,P+16,P+11);
    return puCache[type]=c;
  }

  /* ---------- Levels ---------- */
  const patterns=[
    ()=>1,
    (r,c)=>(r+c)%2?0:(r<2?2:1),
    (r,c)=>(c>=r&&c<COLS-r)?(r===0?2:1):0,
    (r,c)=>Math.abs(c-5.5)+Math.abs(r-3.5)<=5.5?((r+c)%3===0?2:1):0,
    (r)=>r%2===0?2:1,
    (r,c)=>(c%3===1)?0:(r<3?3:1)
  ];
  function buildLevel(){
    bricks.length=0;
    const p=patterns[level%patterns.length], bonus=Math.floor(level/patterns.length);
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      let hp=p(r,c); if(!hp) continue; hp=Math.min(3,hp+bonus);
      bricks.push({x:BM+c*(BW+BG),y:BTOP+r*(BH+BG),w:BW,h:BH,hp,max:hp,
        hue:(190+r*38+level*25)%360,flash:0,t:-(r*.09+c*.03),alive:true,spr:null,sprHp:-1});
    }
  }
  const newBall=()=>({x:paddle.x,y:paddle.y-9,vx:0,vy:0,r:8,stuck:true,trail:[]});
  const baseSpeed=()=>Math.min(10,6+level*.35)*(slowT>0?.7:1);
  function resetPowers(){wideT=slowT=laserT=fireT=0;laserCd=0;paddle.tw=120;lasers.length=0;}

  function loadLevel(){
    buildLevel(); balls.length=0; balls.push(newBall()); powerups.length=0; combo=0; resetPowers(); state='ready';
  }
  function startGame(){
    score=0;lives=3;level=0; particles.length=0;rings.length=0;texts.length=0;
    loadLevel(); overlay.classList.add('hidden'); fit();
  }

  /* ---------- Effects ---------- */
  function burst(x,y,hue,n=18,spd=5){
    if(isTouch)n=Math.ceil(n*.6);
    for(let i=0;i<n&&particles.length<MAX_PARTICLES;i++){const a=rand(0,Math.PI*2),s=rand(1,spd);
      particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(25,45),max:45,size:rand(1.5,3.5),hue});}
    if(rings.length<10)rings.push({x,y,r:4,life:1,hue});
  }
  const floatText=(x,y,str,color='#fff')=>{if(texts.length<8)texts.push({x,y,str,color,life:1});};

  /* ---------- Power-ups ---------- */
  const PU={
    W:{c:'#22d3ee',name:'WIDE PADDLE',run:()=>{wideT=720;paddle.tw=190}},
    M:{c:'#f472b6',name:'MULTI-BALL',run:()=>{const add=[];balls.forEach(b=>{if(b.stuck)return;
        for(const da of[-.5,.5]){const a=Math.atan2(b.vy,b.vx)+da,s=Math.hypot(b.vx,b.vy)||6;
          add.push({x:b.x,y:b.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:8,stuck:false,trail:[]});}});
      add.slice(0,4).forEach(b=>balls.push(b)); if(balls.length>8)balls.length=8;}},
    S:{c:'#facc15',name:'SLOW BALL',run:()=>{slowT=600}},
    L:{c:'#fb7185',name:'LASERS!',run:()=>{laserT=600;laserCd=0}},
    F:{c:'#fb923c',name:'FIREBALL!',run:()=>{fireT=480}},
    '♥':{c:'#ef4444',name:'EXTRA LIFE',run:()=>{lives=Math.min(5,lives+1)}}
  };
  const DROP_POOL=['W','M','S','W','M','L','F','♥'];
  function maybeDrop(b){
    if(Math.random()<.16)powerups.push({x:b.x+b.w/2,y:b.y,type:DROP_POOL[Math.floor(Math.random()*DROP_POOL.length)]});
  }

  /* ---------- Game logic ---------- */
  function launch(){
    if(state!=='ready')return;
    balls.forEach(b=>{if(b.stuck){b.stuck=false;const a=-Math.PI/2+rand(-.3,.3),s=baseSpeed();
      b.vx=Math.cos(a)*s;b.vy=Math.sin(a)*s;}});
    state='play'; beep(440,.12,'triangle',.07,300);
  }

  function hitBrick(b){
    b.hp--; b.flash=1; combo++;
    const mult=1+Math.floor(combo/4);
    if(b.hp<=0){
      b.alive=false; const pts=50*b.max*mult; score+=pts;
      burst(b.x+b.w/2,b.y+b.h/2,b.hue,18,6); shake=Math.min(6,shake+2.5);
      floatText(b.x+b.w/2,b.y,'+'+pts,`hsl(${b.hue},100%,75%)`); maybeDrop(b); sfx.brick(combo);
      if(score>best){best=score;localStorage.setItem('neonBreakoutBest',best);}
    } else { burst(b.x+b.w/2,b.y+b.h/2,b.hue,6,3); score+=10; sfx.hard(); shake=Math.min(6,shake+1); }
  }

  function collide(b){
    if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx);sfx.wall();}
    else if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx);sfx.wall();}
    if(b.y<HUD+b.r){b.y=HUD+b.r;b.vy=Math.abs(b.vy);sfx.wall();}
    const px=paddle.x-paddle.w/2;
    if(b.vy>0&&b.y+b.r>=paddle.y&&b.y-b.r<paddle.y+paddle.h&&b.x>px-b.r&&b.x<px+paddle.w+b.r){
      const hit=clamp((b.x-paddle.x)/(paddle.w/2),-1,1), a=hit*1.05, s=Math.hypot(b.vx,b.vy);
      b.vx=Math.sin(a)*s; b.vy=-Math.cos(a)*s; b.y=paddle.y-b.r;
      combo=0; sfx.paddle(); burst(b.x,paddle.y,200,5,3); shake=Math.min(6,shake+1);
    }
    for(let i=0;i<bricks.length;i++){
      const k=bricks[i];
      if(!k.alive||k.t<1)continue;
      const cx=clamp(b.x,k.x,k.x+k.w), cy=clamp(b.y,k.y,k.y+k.h), dx=b.x-cx, dy=b.y-cy;
      if(dx*dx+dy*dy<b.r*b.r){
        if(fireT>0){ k.hp=1; hitBrick(k); continue; }
        if(dx===0&&dy===0) b.vy=-b.vy;
        else if(Math.abs(dx)>Math.abs(dy)) b.vx=Math.sign(dx)*Math.abs(b.vx);
        else b.vy=Math.sign(dy)*Math.abs(b.vy);
        hitBrick(k); break;
      }
    }
  }

  function loseLife(){
    lives--; sfx.lose(); shake=10; combo=0;
    if(lives<=0){
      state='over'; $title.textContent='GAME OVER';
      $sub.innerHTML=`Score: <b>${score}</b> &nbsp;•&nbsp; Best: <b>${best}</b>`; btn.textContent='PLAY AGAIN';
      overlay.classList.remove('hidden');
    } else { balls.length=0; balls.push(newBall()); resetPowers(); state='ready'; }
  }

  function update(dt){
    time+=dt;
    for(let i=0;i<stars.length;i++){const s=stars[i];s.y+=s.z*.35*dt;if(s.y>H){s.y=0;s.x=rand(0,W);}}
    if(state==='menu'||state==='paused'||state==='over')return;

    if(keys.left)targetX-=14*dt; if(keys.right)targetX+=14*dt;
    targetX=clamp(targetX,paddle.w/2,W-paddle.w/2);
    paddle.w+=(paddle.tw-paddle.w)*Math.min(1,.15*dt);
    paddle.x+=(targetX-paddle.x)*Math.min(1,.75*dt);
    paddle.x=clamp(paddle.x,paddle.w/2,W-paddle.w/2);

    if(wideT>0){wideT-=dt;if(wideT<=0)paddle.tw=120;}
    if(slowT>0)slowT-=dt;
    if(laserT>0)laserT-=dt;
    if(fireT>0)fireT-=dt;

    for(let n=0;n<balls.length;n++){
      const b=balls[n];
      if(b.stuck){b.x=paddle.x;b.y=paddle.y-b.r-1;b.trail.length=0;continue;}
      const sp=baseSpeed(),m=Math.hypot(b.vx,b.vy)||1;
      b.vx*=sp/m;b.vy*=sp/m;
      if(Math.abs(b.vy)<sp*.25){b.vy=Math.sign(b.vy||-1)*sp*.25;}
      const steps=Math.ceil(sp*dt/3),sdt=dt/steps;
      for(let i=0;i<steps;i++){b.x+=b.vx*sdt;b.y+=b.vy*sdt;collide(b);}
      b.trail.push({x:b.x,y:b.y}); if(b.trail.length>(isTouch?7:12))b.trail.shift();
      if(fireT>0&&particles.length<MAX_PARTICLES&&Math.random()<.6)
        particles.push({x:b.x+rand(-3,3),y:b.y+rand(-3,3),vx:rand(-.7,.7),vy:rand(-.7,.7),life:rand(14,24),max:24,size:rand(2,4),hue:rand(5,50)});
    }
    if(state==='play'){
      compact(balls,b=>b.y<H+30);
      if(balls.length===0)loseLife();
    }

    // lasers
    if(state==='play'&&laserT>0){
      laserCd-=dt;
      if(laserCd<=0){laserCd=14;
        lasers.push({x:paddle.x-paddle.w/2+14,y:paddle.y},{x:paddle.x+paddle.w/2-14,y:paddle.y});sfx.laser();}
    }
    if(state==='play'){
      for(const l of lasers){
        l.y-=13*dt;
        if(l.y<HUD){l.dead=true;continue;}
        for(let i=0;i<bricks.length;i++){
          const k=bricks[i];
          if(!k.alive||k.t<1)continue;
          if(l.x>k.x&&l.x<k.x+k.w&&l.y>k.y&&l.y<k.y+k.h){hitBrick(k);l.dead=true;burst(l.x,l.y,350,4,3);break;}
        }
      }
      compact(lasers,l=>!l.dead);
    }

    // power-ups
    for(const p of powerups){
      p.y+=3*dt;
      if(p.y>paddle.y-6&&p.y<paddle.y+paddle.h+14&&Math.abs(p.x-paddle.x)<paddle.w/2+16){
        p.dead=true; PU[p.type].run(); sfx.power(); burst(p.x,p.y,40,12,5); floatText(p.x,p.y-14,PU[p.type].name,PU[p.type].c);
      }
      if(p.y>H+20)p.dead=true;
    }
    compact(powerups,p=>!p.dead);

    let alive=0;
    for(let i=0;i<bricks.length;i++){const b=bricks[i];
      if(b.t<1)b.t+=.04*dt; if(b.flash>0)b.flash-=.08*dt; if(b.alive)alive++;}

    if(state==='play'&&alive===0){
      state='clear'; clearTimer=110; sfx.clear(); score+=500*(level+1); lasers.length=0;
      floatText(W/2,H/2,'LEVEL CLEAR!','#fff'); burst(W/2,H/2,rand(0,360),50,9);
    }
    if(state==='clear'){clearTimer-=dt; if(clearTimer<=0){level++;loadLevel();}}

    for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.08*dt;p.vx*=.99;p.life-=dt;}
    compact(particles,p=>p.life>0);
    for(const r of rings){r.r+=3.2*dt;r.life-=.04*dt;}
    compact(rings,r=>r.life>0);
    for(const t of texts){t.y-=.8*dt;t.life-=.015*dt;}
    compact(texts,t=>t.life>0);
    shake*=Math.pow(.88,dt); if(shake<.1)shake=0;
  }

  /* ---------- Rendering (cheap per-frame work only) ---------- */
  function drawBrick(b){
    if(!b.alive||b.t<=0)return;
    if(b.sprHp!==b.hp){b.spr=brickSprite(b);b.sprHp=b.hp;}
    const e=b.t>=1?1:b.t, ease=e>=1?1:1-Math.pow(1-e,3), y=b.y-(1-ease)*30;
    if(ease<1)ctx.globalAlpha=ease;
    ctx.drawImage(b.spr,b.x-PAD,y-PAD,BW+PAD*2,BH+PAD*2);
    if(b.flash>0){ctx.globalAlpha=Math.min(1,b.flash*.7);ctx.fillStyle='#fff';rr(ctx,b.x,y,b.w,b.h,6);ctx.fill();}
    if(ctx.globalAlpha!==1)ctx.globalAlpha=1;
  }

  function drawPaddle(){
    const x=paddle.x-paddle.w/2,y=paddle.y;
    const col=laserT>0?'251,113,133':'34,211,238';
    ctx.fillStyle=`rgba(${col},.12)`;rr(ctx,x-9,y-9,paddle.w+18,paddle.h+18,paddle.h);ctx.fill();
    ctx.fillStyle=`rgba(${col},.22)`;rr(ctx,x-4,y-4,paddle.w+8,paddle.h+8,paddle.h);ctx.fill();
    const g=ctx.createLinearGradient(x,0,x+paddle.w,0);
    g.addColorStop(0,'#7c3aed');g.addColorStop(.5,'#22d3ee');g.addColorStop(1,'#ec4899');
    ctx.fillStyle=g;rr(ctx,x,y,paddle.w,paddle.h,paddle.h/2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.45)';rr(ctx,x+8,y+2,paddle.w-16,5,3);ctx.fill();
    if(laserT>0){
      ctx.fillStyle='#fecdd3';
      rr(ctx,x+10,y-8,8,12,3);ctx.fill();rr(ctx,x+paddle.w-18,y-8,8,12,3);ctx.fill();
    }
  }

  function drawLasers(){
    if(!lasers.length)return;
    ctx.lineCap='round';
    ctx.strokeStyle='rgba(251,113,133,.4)';ctx.lineWidth=7;ctx.beginPath();
    for(const l of lasers){ctx.moveTo(l.x,l.y);ctx.lineTo(l.x,l.y+16);}
    ctx.stroke();
    ctx.strokeStyle='#ffe4e6';ctx.lineWidth=3;ctx.beginPath();
    for(const l of lasers){ctx.moveTo(l.x,l.y);ctx.lineTo(l.x,l.y+16);}
    ctx.stroke();
  }

  function drawBall(b){
    const fire=fireT>0, tc=fire?'255,140,40':'120,220,255';
    for(let i=0;i<b.trail.length;i++){
      const t=b.trail[i],k=i/b.trail.length;
      ctx.fillStyle=`rgba(${tc},${k*.38})`;
      const r=b.r*k;ctx.fillRect(t.x-r,t.y-r,r*2,r*2);
    }
    const sp=fire?fireSpr:ballSpr;
    ctx.drawImage(sp.c,b.x-sp.R,b.y-sp.R,sp.R*2,sp.R*2);
  }

  function drawHUD(){
    ctx.fillStyle='rgba(10,6,32,.9)';ctx.fillRect(0,0,W,HUD);
    ctx.fillStyle='rgba(160,130,255,.4)';ctx.fillRect(0,HUD-1,W,1);
    ctx.textBaseline='middle';ctx.font='700 16px Orbitron, sans-serif';
    ctx.textAlign='left';ctx.fillStyle='#e9d5ff';ctx.fillText('SCORE '+score,20,HUD/2);
    ctx.textAlign='center';ctx.fillStyle='#67e8f9';ctx.fillText('LEVEL '+(level+1)+'   BEST '+best,W/2,HUD/2);
    ctx.textAlign='right';ctx.fillStyle='#fb7185';ctx.fillText('♥'.repeat(lives),W-(isTouch?64:20),HUD/2);
    if(combo>=4){ctx.textAlign='left';ctx.fillStyle='#facc15';ctx.font='700 12px Orbitron, sans-serif';
      ctx.fillText('COMBO x'+(1+Math.floor(combo/4)),20,HUD+16);}
    if(wideT>0||slowT>0||laserT>0||fireT>0){
      const st=[];if(wideT>0)st.push('WIDE');if(slowT>0)st.push('SLOW');if(laserT>0)st.push('LASER');if(fireT>0)st.push('FIRE');
      ctx.textAlign='right';ctx.font='700 11px Orbitron, sans-serif';ctx.fillStyle='#a5f3fc';
      ctx.fillText(st.join('  '),W-20,HUD+16);}
  }

  function draw(){
    ctx.drawImage(bgCanvas,0,0,W,H);                       // baked background
    ctx.fillStyle='#c9c4ff';ctx.globalAlpha=.75;           // stars (one style, no per-star alpha)
    for(let i=0;i<stars.length;i++){const s=stars[i];ctx.fillRect(s.x,s.y,s.z*2,s.z*2);}
    ctx.globalAlpha=1;

    ctx.save();
    if(shake>0)ctx.translate(rand(-shake,shake),rand(-shake,shake));
    for(let i=0;i<bricks.length;i++)drawBrick(bricks[i]);
    for(const p of powerups)ctx.drawImage(puSprite(p.type),p.x-32,p.y-26,64,52);

    ctx.lineWidth=2;
    for(const r of rings){ctx.strokeStyle=`hsla(${r.hue},100%,70%,${r.life*.6})`;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.stroke();}

    if(!isTouch)ctx.globalCompositeOperation='lighter';
    for(const p of particles){
      ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=`hsl(${p.hue|0},100%,60%)`;
      ctx.fillRect(p.x-p.size,p.y-p.size,p.size*2,p.size*2);
    }
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';

    drawLasers();
    for(const b of balls)drawBall(b);
    drawPaddle();
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='900 18px Orbitron, sans-serif';
    for(const t of texts){ctx.globalAlpha=Math.max(0,t.life);ctx.fillStyle=t.color;ctx.fillText(t.str,t.x,t.y);}
    ctx.globalAlpha=1;
    ctx.restore();

    drawHUD();
    if(state==='ready'){ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=`rgba(255,255,255,${.5+.4*Math.sin(time*.1)})`;
      ctx.font='700 16px Orbitron, sans-serif';ctx.fillText(isTouch?'TAP SCREEN TO LAUNCH':'CLICK / SPACE TO LAUNCH',W/2,H/2+80);}
  }

  /* ---------- Loop ---------- */
  let last=performance.now();
  function frame(now){
    const dt=Math.min((now-last)/16.667,2.5);last=now;
    update(dt);draw();requestAnimationFrame(frame);
  }

  /* ---------- Input ---------- */
  const onCtl=e=>e.target.closest&&e.target.closest('.ctl,#pauseBtn');
  function setTarget(clientX){
    const r=cv.getBoundingClientRect();targetX=(clientX-r.left)*(W/r.width);
  }
  function initAudio(){
    if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
    if(actx&&actx.state==='suspended')actx.resume();
  }
  function togglePause(){
    if(state==='play'||state==='ready'){
      state='paused';$title.textContent='PAUSED';$sub.innerHTML='Press P or tap Resume';
      btn.textContent='RESUME';overlay.classList.remove('hidden');
    } else if(state==='paused'){resume();}
  }
  function resume(){
    overlay.classList.add('hidden');
    state=balls.some(b=>b.stuck)?'ready':'play';
  }

  window.addEventListener('mousemove',e=>{if(!onCtl(e))setTarget(e.clientX);});
  window.addEventListener('touchstart',e=>{if(!onCtl(e))setTarget(e.touches[0].clientX);},{passive:true});
  window.addEventListener('touchmove',e=>{e.preventDefault();if(!onCtl(e))setTarget(e.touches[0].clientX);},{passive:false});
  cv.addEventListener('mousedown',()=>{initAudio();launch();});
  cv.addEventListener('touchend',()=>{initAudio();launch();});
  window.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=true;
    if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=true;
    if(e.code==='Space'){e.preventDefault();initAudio();launch();}
    if(e.key==='p'||e.key==='P'||e.key==='Escape')togglePause();
  });
  window.addEventListener('keyup',e=>{
    if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=false;
    if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=false;
  });
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')togglePause();});
  btn.addEventListener('click',()=>{initAudio();if(state==='paused')resume();else startGame();});

  // On-screen arrow buttons (hold to move)
  function bindCtl(id,dir){
    const el=document.getElementById(id);
    const on=e=>{e.preventDefault();initAudio();keys[dir]=true;el.classList.add('active');
      if(el.setPointerCapture)try{el.setPointerCapture(e.pointerId)}catch(_){}};
    const off=()=>{keys[dir]=false;el.classList.remove('active');};
    el.addEventListener('pointerdown',on);
    ['pointerup','pointercancel','lostpointercapture'].forEach(n=>el.addEventListener(n,off));
    el.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
    el.addEventListener('contextmenu',e=>e.preventDefault());
  }
  bindCtl('btnL','left');bindCtl('btnR','right');
  const pb=document.getElementById('pauseBtn');
  pb.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
  pb.addEventListener('click',()=>{initAudio();togglePause();});

  buildLevel();
  fit();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
