<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Flappy Sky</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: #0b1d3a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
    overflow: hidden;
    touch-action: manipulation;
    user-select: none;
  }
  #wrap {
    position: relative;
    height: min(100vh, 100vw * 1.5);
    aspect-ratio: 2 / 3;
    box-shadow: 0 0 40px rgba(0,0,0,.6);
    border-radius: 12px;
    overflow: hidden;
  }
  #game { width: 100%; height: 100%; display: block; }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #fff; text-align: center;
    pointer-events: none;
    text-shadow: 0 3px 0 rgba(0,0,0,.35);
  }
  .overlay h1 { font-size: clamp(30px, 8.5vw, 54px); letter-spacing: 2px; }
  .overlay p { font-size: clamp(13px, 3.8vw, 19px); margin-top: 10px; opacity: .95; }
  .panel {
    background: rgba(15, 30, 60, .8);
    border: 3px solid #ffd54a;
    border-radius: 16px;
    padding: 18px 28px;
    backdrop-filter: blur(4px);
  }
  .hidden { display: none !important; }
  .blink { animation: blink 1.1s infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  .skinbar { pointer-events: auto; margin-top: 12px; }
  .coinrow { font-size: 18px; font-weight: bold; color: #ffd54a; }
  .skinrow { display: flex; align-items: center; justify-content: center; gap: 6px; }
  #skinPrev { background: rgba(255,255,255,.08); border-radius: 12px; }
  #skinName { font-size: 18px; font-weight: bold; margin: 4px 0 8px; }
  .arrow, .pill {
    font-family: inherit; cursor: pointer; color: #fff;
    border: 2px solid #ffd54a; background: rgba(255,213,74,.15);
    border-radius: 999px;
  }
  .arrow { width: 40px; height: 40px; font-size: 18px; }
  .pill { padding: 7px 16px; font-size: 14px; font-weight: bold; }
  .pill:disabled { opacity: .5; cursor: default; }
  .arrow:active, .pill:not(:disabled):active { transform: scale(.94); }
  .legend { font-size: 12px; opacity: .85; margin-top: 10px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="400" height="600"></canvas>

  <div id="startScreen" class="overlay">
    <div class="panel">
      <h1>FLAPPY SKY</h1>
      <div id="skinBar" class="skinbar">
        <div class="coinrow">🪙 <span id="coinLabel">0</span></div>
        <div class="skinrow">
          <button id="prevSkin" class="arrow">◀</button>
          <canvas id="skinPrev" width="120" height="80"></canvas>
          <button id="nextSkin" class="arrow">▶</button>
        </div>
        <div id="skinName"></div>
        <button id="skinBtn" class="pill"></button>
      </div>
      <div class="legend">🛡️ Shield &nbsp; ⏳ Slow-Mo &nbsp; 🧲 Magnet</div>
      <p class="blink">Tap / Click / Space to flap</p>
    </div>
  </div>

  <div id="overScreen" class="overlay hidden">
    <div class="panel">
      <h1>GAME OVER</h1>
      <p id="finalScore"></p>
      <p id="bestScore"></p>
      <p id="runCoins"></p>
      <p class="blink">Tap / Space to retry</p>
    </div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = 400, H = 600;
  const startScreen = document.getElementById('startScreen');
  const overScreen = document.getElementById('overScreen');

  // ---------- Config ----------
  const GRAVITY = 0.42;
  const FLAP = -7.4;
  const PIPE_W = 70;
  const GAP_START = 175;
  const GAP_MIN = 135;
  const PIPE_SPACING = 210;
  const GROUND_H = 80;
  const BASE_SPEED = 2.6;
  const SLOW_TIME = 300;    // frames (5s)
  const MAGNET_TIME = 480;  // frames (8s)
  const THEME_EVERY = 10;   // score points per day/night change

  // ---------- Storage ----------
  function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  // ---------- Skins ----------
  const SKINS = [
    { name: 'Sunny',  b1: '#fff07a', b2: '#f5a623', wing: '#ffd24a', edge: '#a35c00', glow: 'rgba(255,200,60,.55)',  cost: 0 },
    { name: 'Ruby',   b1: '#ffb3b3', b2: '#e0314b', wing: '#ff6b81', edge: '#7a0f20', glow: 'rgba(255,90,110,.55)',  cost: 20 },
    { name: 'Ocean',  b1: '#b5ecff', b2: '#1e88e5', wing: '#4fc3f7', edge: '#0d3c75', glow: 'rgba(80,180,255,.55)',  cost: 30 },
    { name: 'Forest', b1: '#c8f7a0', b2: '#2e9e4f', wing: '#76d672', edge: '#14532d', glow: 'rgba(100,230,120,.5)',  cost: 40 },
    { name: 'Royal',  b1: '#ecc6ff', b2: '#8e24aa', wing: '#ba68c8', edge: '#4a0e5c', glow: 'rgba(190,110,255,.55)', cost: 60 },
    { name: 'Golden', b1: '#fffbe0', b2: '#d4a017', wing: '#ffe066', edge: '#7a5a00', glow: 'rgba(255,230,120,.95)', cost: 100 }
  ];
  let coins = Number(safeGet('fsCoins')) || 0;
  let unlocked = [0];
  try { const u = JSON.parse(safeGet('fsUnlocked')); if (Array.isArray(u) && u.length) unlocked = u; } catch (e) {}
  let selected = Number(safeGet('fsSkin')) || 0;
  if (!unlocked.includes(selected)) selected = 0;
  let viewIdx = selected;
  function saveAll() {
    safeSet('fsCoins', coins);
    safeSet('fsUnlocked', JSON.stringify(unlocked));
    safeSet('fsSkin', selected);
  }

  // ---------- Day / Night themes ----------
  const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const rgb = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
  const mk = (name, sky, hill, star, moon, sunY, dark) =>
    ({ name, sky: sky.map(hex), hill: hex(hill), star, moon, sunY, dark });
  const THEMES = [
    mk('☀️ Day',    ['#3d9bf0', '#79c7ff', '#b8e6ff', '#e6f6ff'], '#5b8fb9', 0,    0, 130, 0),
    mk('🌇 Sunset', ['#1b2f6b', '#ff8a5c', '#ffd08a', '#ffe9b8'], '#6a4a8c', 0.35, 0, 360, 0.06),
    mk('🌙 Night',  ['#040816', '#0b1636', '#16295c', '#27407a'], '#1a2650', 1,    1, 130, 0.30),
    mk('🌅 Dawn',   ['#2b2d6e', '#c86a9a', '#ffb48a', '#ffe0b0'], '#5a4a85', 0.45, 0, 350, 0.10)
  ];
  const hr = new Date().getHours();
  const startTheme = (hr >= 7 && hr < 17) ? 0 : (hr >= 17 && hr < 19) ? 1 : (hr >= 19 || hr < 5) ? 2 : 3;
  let themeIdx = startTheme;
  const cur = JSON.parse(JSON.stringify(THEMES[startTheme]));
  let toast = { text: '', t: 0 };

  function blendTheme() {
    const tg = THEMES[themeIdx], k = 0.02;
    for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++) cur.sky[i][j] += (tg.sky[i][j] - cur.sky[i][j]) * k;
    for (let j = 0; j < 3; j++) cur.hill[j] += (tg.hill[j] - cur.hill[j]) * k;
    cur.star += (tg.star - cur.star) * k;
    cur.moon += (tg.moon - cur.moon) * k;
    cur.sunY += (tg.sunY - cur.sunY) * k;
    cur.dark += (tg.dark - cur.dark) * k;
  }

  // ---------- State ----------
  let state = 'ready'; // ready | playing | dead
  let bird, pipes, items, score, best, frame, speed, shake, particles, clouds, hills, stars;
  let slowT = 0, magT = 0, runCoins = 0, groundOff = 0, hillOff = 0;
  best = Number(safeGet('flappySkyBest')) || 0;

  // ---------- Audio (tiny WebAudio beeps, no files) ----------
  let actx;
  function beep(freq, dur, type = 'sine', vol = 0.12, slide = 0, delay = 0) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const t0 = actx.currentTime + delay;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t0);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t0 + dur);
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t0); o.stop(t0 + dur);
    } catch (e) {}
  }

  // ---------- Setup ----------
  function reset() {
    bird = { x: 110, y: H / 2 - 30, vy: 0, r: 15, rot: 0, wing: 0, shield: false, inv: 0 };
    pipes = []; items = []; particles = [];
    score = 0; frame = 0; speed = BASE_SPEED; shake = 0;
    slowT = 0; magT = 0; runCoins = 0;
    themeIdx = startTheme;
    if (!clouds) {
      clouds = Array.from({ length: 6 }, () => ({
        x: Math.random() * W, y: 40 + Math.random() * 220,
        s: 0.6 + Math.random() * 0.9, v: 0.15 + Math.random() * 0.3
      }));
      hills = Array.from({ length: 6 }, (_, i) => ({ x: i * 110, h: 60 + Math.random() * 70 }));
      stars = Array.from({ length: 45 }, () => ({
        x: Math.random() * W, y: Math.random() * 300, r: Math.random() * 1.4 + .3
      }));
    }
    addPipe(W + 120);
  }

  function addPipe(x) {
    const gap = Math.max(GAP_MIN, GAP_START - score * 1.5);
    const minTop = 70;
    const maxTop = H - GROUND_H - gap - 70;
    const top = minTop + Math.random() * (maxTop - minTop);
    pipes.push({ x, top, gap, passed: false });

    const cx = x + PIPE_W / 2, cy = top + gap / 2;
    if (score >= 3 && Math.random() < 0.14) {
      const types = ['shield', 'slow', 'magnet'];
      items.push({ type: types[(Math.random() * 3) | 0], x: cx, y: cy, taken: false, ph: Math.random() * 6 });
    } else if (Math.random() < 0.85) {
      items.push({ type: 'coin', x: cx, y: cy, taken: false, ph: Math.random() * 6 });
    }
    if (Math.random() < 0.5) {
      items.push({ type: 'coin', x: x + PIPE_W + PIPE_SPACING / 2 - 35, y: cy + (Math.random() - .5) * 60, taken: false, ph: Math.random() * 6 });
    }
  }

  // ---------- Input ----------
  function flap() {
    if (state === 'ready') {
      state = 'playing';
      startScreen.classList.add('hidden');
    }
    if (state === 'playing') {
      bird.vy = FLAP;
      beep(520, 0.12, 'triangle', 0.1, 260);
      for (let i = 0; i < 6; i++) {
        particles.push({
          x: bird.x - 10, y: bird.y + 6,
          vx: -1 - Math.random() * 1.5, vy: (Math.random() - 0.3) * 1.5,
          life: 22, max: 22, size: 2 + Math.random() * 3, color: '255,255,255'
        });
      }
    } else if (state === 'dead' && frame > 35) {
      overScreen.classList.add('hidden');
      reset();
      state = 'ready';
      startScreen.classList.remove('hidden');
      refreshSkinUI();
    }
  }

  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      flap();
    }
  });
  document.getElementById('wrap').addEventListener('pointerdown', e => { e.preventDefault(); flap(); });

  // ---------- Skin selector UI ----------
  const skinBar = document.getElementById('skinBar');
  const skinName = document.getElementById('skinName');
  const skinBtn = document.getElementById('skinBtn');
  const coinLabel = document.getElementById('coinLabel');
  const skinPrev = document.getElementById('skinPrev');
  const pctx = skinPrev.getContext('2d');
  skinBar.addEventListener('pointerdown', e => e.stopPropagation());

  function refreshSkinUI() {
    const s = SKINS[viewIdx];
    const owned = unlocked.includes(viewIdx);
    skinName.textContent = s.name;
    coinLabel.textContent = coins;
    if (owned) { skinBtn.textContent = '✔ Equipped'; skinBtn.disabled = true; }
    else {
      skinBtn.textContent = '🔒 Unlock · ' + s.cost + ' coins';
      skinBtn.disabled = coins < s.cost;
    }
  }
  function changeSkin(d) {
    viewIdx = (viewIdx + d + SKINS.length) % SKINS.length;
    if (unlocked.includes(viewIdx)) { selected = viewIdx; saveAll(); }
    refreshSkinUI();
  }
  document.getElementById('prevSkin').addEventListener('click', e => { changeSkin(-1); e.target.blur(); });
  document.getElementById('nextSkin').addEventListener('click', e => { changeSkin(1); e.target.blur(); });
  skinBtn.addEventListener('click', () => {
    const s = SKINS[viewIdx];
    if (!unlocked.includes(viewIdx) && coins >= s.cost) {
      coins -= s.cost;
      unlocked.push(viewIdx);
      selected = viewIdx;
      saveAll();
      beep(660, 0.1, 'square', 0.08); beep(990, 0.15, 'square', 0.08, 0, 0.1);
      refreshSkinUI();
    }
    skinBtn.blur();
  });

  // ---------- Game logic ----------
  const gSpeed = () => speed * (slowT > 0 ? 0.62 : 1);

  function burst(x, y, n, color, power = 3) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * power;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 30, max: 30, size: 2 + Math.random() * 3, color });
    }
  }

  function die() {
    state = 'dead';
    frame = 0;
    shake = 14;
    beep(180, 0.45, 'sawtooth', 0.15, -120);
    for (let i = 0; i < 28; i++) {
      const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 4;
      particles.push({
        x: bird.x, y: bird.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 40, max: 40, size: 2 + Math.random() * 4,
        color: Math.random() > .5 ? '255,214,74' : '255,120,60'
      });
    }
    if (score > best) { best = score; safeSet('flappySkyBest', best); }
    saveAll();
    document.getElementById('finalScore').textContent = 'Score: ' + score;
    document.getElementById('bestScore').textContent = 'Best: ' + best;
    document.getElementById('runCoins').textContent = '🪙 +' + runCoins + ' coins (total ' + coins + ')';
    overScreen.classList.remove('hidden');
  }

  function hit() {
    if (bird.inv > 0) return;
    if (bird.shield) {
      bird.shield = false;
      bird.inv = 70;
      bird.vy = -8;
      shake = 8;
      burst(bird.x, bird.y, 18, '79,195,247', 4);
      beep(300, 0.3, 'sawtooth', 0.12, -150);
      return;
    }
    die();
  }

  function collect(it) {
    it.taken = true;
    if (it.type === 'coin') {
      coins++; runCoins++;
      burst(it.x, it.y, 8, '255,214,74', 3);
      beep(1046, 0.08, 'square', 0.06); beep(1568, 0.1, 'square', 0.06, 0, 0.06);
    } else {
      burst(it.x, it.y, 16, '255,255,255', 4);
      beep(600, 0.1, 'triangle', 0.1); beep(900, 0.1, 'triangle', 0.1, 0, 0.08); beep(1300, 0.15, 'triangle', 0.1, 0, 0.16);
      if (it.type === 'shield') bird.shield = true;
      if (it.type === 'slow') slowT = SLOW_TIME;
      if (it.type === 'magnet') magT = MAGNET_TIME;
    }
  }

  function update() {
    frame++;
    blendTheme();
    if (toast.t > 0) toast.t--;
    const gs = gSpeed();
    clouds.forEach(c => { c.x -= c.v; if (c.x < -120) { c.x = W + 60; c.y = 40 + Math.random() * 220; } });
    hills.forEach(h => { h.x -= gs * 0.25; if (h.x < -140) h.x += hills.length * 110; });
    if (state !== 'dead') groundOff = (groundOff + gs) % 28;

    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life--; });
    particles = particles.filter(p => p.life > 0);
    if (shake > 0) shake *= 0.88;

    if (state === 'ready') {
      bird.y = H / 2 - 30 + Math.sin(frame / 14) * 8;
      bird.rot = 0;
      bird.wing = Math.sin(frame / 3);
      return;
    }

    if (state === 'dead') {
      bird.vy += GRAVITY;
      bird.y = Math.min(bird.y + bird.vy, H - GROUND_H - bird.r);
      bird.rot = Math.min(bird.rot + 0.1, Math.PI / 2);
      return;
    }

    // ----- playing -----
    speed = BASE_SPEED + Math.min(score * 0.04, 2);
    bird.vy += GRAVITY;
    bird.y += bird.vy;
    bird.rot = Math.max(-0.45, Math.min(bird.vy * 0.075, 1.2));
    bird.wing = Math.sin(frame / 2.2);
    if (bird.inv > 0) bird.inv--;
    if (slowT > 0) slowT--;
    if (magT > 0) magT--;

    pipes.forEach(p => p.x -= gs);
    if (pipes[0].x < -PIPE_W - 10) pipes.shift();
    const last = pipes[pipes.length - 1];
    if (last.x < W - PIPE_SPACING) addPipe(W + 20);

    // items
    for (const it of items) {
      it.x -= gs;
      if (magT > 0 && it.type === 'coin') {
        const dx = bird.x - it.x, dy = bird.y - it.y, d = Math.hypot(dx, dy);
        if (d < 170 && d > 1) { it.x += dx / d * 5.5; it.y += dy / d * 5.5; }
      }
      if (!it.taken) {
        const rr = bird.r + (it.type === 'coin' ? 12 : 18);
        if (Math.hypot(bird.x - it.x, bird.y - it.y) < rr) collect(it);
      }
    }
    items = items.filter(it => !it.taken && it.x > -40);

    // pipes
    for (const p of pipes) {
      if (!p.passed && p.x + PIPE_W < bird.x) {
        p.passed = true;
        score++;
        beep(880, 0.1, 'square', 0.07); beep(1175, 0.12, 'square', 0.07);
        const idx = (startTheme + Math.floor(score / THEME_EVERY)) % THEMES.length;
        if (idx !== themeIdx) { themeIdx = idx; toast = { text: THEMES[idx].name, t: 120 }; }
      }
      const inX = bird.x + bird.r - 3 > p.x && bird.x - bird.r + 3 < p.x + PIPE_W;
      if (inX && (bird.y - bird.r + 3 < p.top || bird.y + bird.r - 3 > p.top + p.gap)) {
        hit();
        if (state === 'dead') return;
      }
    }
    if (bird.y + bird.r > H - GROUND_H) {
      bird.y = H - GROUND_H - bird.r;
      hit();
      if (state === 'dead') return;
    }
    if (bird.y - bird.r < -40) { bird.y = -40 + bird.r; bird.vy = 0; }
  }

  // ---------- Drawing ----------
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgb(cur.sky[0]));
    g.addColorStop(0.4, rgb(cur.sky[1]));
    g.addColorStop(0.75, rgb(cur.sky[2]));
    g.addColorStop(1, rgb(cur.sky[3]));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // stars
    ctx.fillStyle = '#fff';
    stars.forEach(s => {
      ctx.globalAlpha = Math.max(0, 0.9 - s.y / 330) * (0.6 + 0.4 * Math.sin(frame / 20 + s.x)) * cur.star;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
    });
    ctx.globalAlpha = 1;

    // sun
    const sa = 1 - cur.moon;
    if (sa > 0.01) {
      ctx.globalAlpha = sa;
      const sg = ctx.createRadialGradient(290, cur.sunY, 10, 290, cur.sunY, 110);
      sg.addColorStop(0, 'rgba(255,250,210,1)');
      sg.addColorStop(0.3, 'rgba(255,210,120,.9)');
      sg.addColorStop(1, 'rgba(255,160,90,0)');
      ctx.fillStyle = sg;
      ctx.beginPath(); ctx.arc(290, cur.sunY, 110, 0, 7); ctx.fill();
    }
    // moon
    if (cur.moon > 0.01) {
      ctx.globalAlpha = cur.moon;
      const mg = ctx.createRadialGradient(290, cur.sunY, 20, 290, cur.sunY, 80);
      mg.addColorStop(0, 'rgba(220,230,255,.45)');
      mg.addColorStop(1, 'rgba(220,230,255,0)');
      ctx.fillStyle = mg;
      ctx.beginPath(); ctx.arc(290, cur.sunY, 80, 0, 7); ctx.fill();
      ctx.fillStyle = '#f4f1de';
      ctx.beginPath(); ctx.arc(290, cur.sunY, 26, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(160,160,170,.35)';
      ctx.beginPath(); ctx.arc(282, cur.sunY - 6, 6, 0, 7); ctx.arc(298, cur.sunY + 8, 4, 0, 7); ctx.arc(292, cur.sunY - 14, 3, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawClouds() {
    const a = 0.55 - cur.dark * 0.8;
    clouds.forEach(c => {
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.scale(c.s, c.s);
      ctx.fillStyle = `rgba(255,255,255,${Math.max(.12, a)})`;
      ctx.beginPath();
      ctx.arc(0, 0, 22, 0, 7); ctx.arc(26, -8, 28, 0, 7);
      ctx.arc(56, 0, 22, 0, 7); ctx.arc(28, 8, 24, 0, 7);
      ctx.fill();
      ctx.restore();
    });
  }

  function drawHills() {
    const gy = H - GROUND_H;
    ctx.fillStyle = rgb(cur.hill);
    hills.forEach(h => {
      ctx.beginPath();
      ctx.moveTo(h.x, gy);
      ctx.quadraticCurveTo(h.x + 55, gy - h.h * 1.6, h.x + 110, gy);
      ctx.closePath(); ctx.fill();
    });
    // rolling bushes
    ctx.fillStyle = '#3f6b4a';
    ctx.beginPath(); ctx.moveTo(0, gy);
    for (let x = 0; x <= W + 40; x += 40) {
      ctx.lineTo(x - (hillOff % 40), gy - 20 - Math.sin((x + frame * 0.3) / 30) * 8);
    }
    ctx.lineTo(W + 40, gy); ctx.closePath(); ctx.fill();
    hillOff += gSpeed() * 0.5;
  }

  function drawPipe(p) {
    const capH = 28, capExtra = 6;
    function body(x, y, w, h) {
      const g = ctx.createLinearGradient(x, 0, x + w, 0);
      g.addColorStop(0, '#2f8f3a');
      g.addColorStop(0.35, '#7ed957');
      g.addColorStop(0.6, '#4fb848');
      g.addColorStop(1, '#1f6b2c');
      ctx.fillStyle = g;
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = '#144d1f'; ctx.lineWidth = 3;
      ctx.strokeRect(x, y, w, h);
    }
    body(p.x, -10, PIPE_W, p.top + 10 - capH);
    body(p.x - capExtra, p.top - capH, PIPE_W + capExtra * 2, capH);
    const by = p.top + p.gap;
    body(p.x - capExtra, by, PIPE_W + capExtra * 2, capH);
    body(p.x, by + capH, PIPE_W, H - GROUND_H - by - capH);
    ctx.fillStyle = 'rgba(255,255,255,.18)';
    ctx.fillRect(p.x + 8, -10, 6, p.top - capH + 10);
    ctx.fillRect(p.x + 8, by + capH, 6, H);
  }

  function drawGround() {
    const y = H - GROUND_H;
    const g = ctx.createLinearGradient(0, y, 0, H);
    g.addColorStop(0, '#d9b36b'); g.addColorStop(1, '#a8803f');
    ctx.fillStyle = g; ctx.fillRect(0, y, W, GROUND_H);
    ctx.fillStyle = '#6cc04a'; ctx.fillRect(0, y, W, 14);
    ctx.fillStyle = '#4a9a35'; ctx.fillRect(0, y + 14, W, 4);
    ctx.fillStyle = 'rgba(0,0,0,.12)';
    for (let x = -28; x < W + 28; x += 28) {
      ctx.beginPath();
      ctx.moveTo(x - groundOff, y + 18); ctx.lineTo(x - groundOff + 14, y + 18);
      ctx.lineTo(x - groundOff + 4, y + GROUND_H); ctx.lineTo(x - groundOff - 10, y + GROUND_H);
      ctx.fill();
    }
  }

  // Draws a bird on any context (used for the game and the skin preview)
  function drawBirdAt(c, x, y, rot, wing, skin, r) {
    c.save();
    c.translate(x, y);
    c.rotate(rot);
    c.shadowColor = skin.glow;
    c.shadowBlur = 14;
    const bg = c.createRadialGradient(-4, -6, 2, 0, 0, r + 4);
    bg.addColorStop(0, skin.b1); bg.addColorStop(1, skin.b2);
    c.fillStyle = bg;
    c.beginPath(); c.ellipse(0, 0, r + 3, r, 0, 0, 7); c.fill();
    c.shadowBlur = 0;
    c.strokeStyle = skin.edge; c.lineWidth = 2; c.stroke();

    c.save();
    c.translate(-4, 3);
    c.rotate(wing * 0.6);
    c.fillStyle = skin.wing; c.strokeStyle = skin.edge;
    c.beginPath(); c.ellipse(0, 0, 10, 6, -0.3, 0, 7); c.fill(); c.stroke();
    c.restore();

    c.fillStyle = '#fff';
    c.beginPath(); c.arc(8, -5, 6, 0, 7); c.fill();
    c.fillStyle = '#111';
    c.beginPath(); c.arc(10, -5, 3, 0, 7); c.fill();
    c.fillStyle = '#fff';
    c.beginPath(); c.arc(11, -6, 1, 0, 7); c.fill();

    c.fillStyle = '#ff5a36'; c.strokeStyle = '#a32c10';
    c.beginPath(); c.moveTo(14, 0); c.lineTo(25, 3); c.lineTo(14, 8); c.closePath();
    c.fill(); c.stroke();
    c.restore();
  }

  function drawBird() {
    const skin = SKINS[selected];
    if (bird.inv > 0 && Math.floor(frame / 4) % 2 === 0) ctx.globalAlpha = 0.45;
    drawBirdAt(ctx, bird.x, bird.y, bird.rot, bird.wing, skin, bird.r);
    ctx.globalAlpha = 1;

    if (bird.shield) {
      const pulse = 1 + Math.sin(frame / 8) * 0.06;
      ctx.beginPath();
      ctx.arc(bird.x, bird.y, (bird.r + 12) * pulse, 0, 7);
      ctx.fillStyle = 'rgba(79,195,247,.2)'; ctx.fill();
      ctx.strokeStyle = 'rgba(160,225,255,.9)'; ctx.lineWidth = 2.5; ctx.stroke();
    }
    if (magT > 0) {
      ctx.beginPath();
      ctx.arc(bird.x, bird.y, 40 + ((frame * 2) % 30), 0, 7);
      ctx.strokeStyle = `rgba(239,83,80,${0.5 - ((frame * 2) % 30) / 70})`;
      ctx.lineWidth = 2; ctx.stroke();
    }
  }

  function drawItem(it) {
    const y = it.y + Math.sin(frame / 12 + it.ph) * 4;
    if (it.type === 'coin') {
      const sx = Math.max(0.15, Math.abs(Math.cos(frame / 14 + it.ph)));
      ctx.save();
      ctx.translate(it.x, y);
      ctx.scale(sx, 1);
      ctx.shadowColor = 'rgba(255,210,60,.9)'; ctx.shadowBlur = 12;
      const g = ctx.createRadialGradient(-3, -3, 2, 0, 0, 12);
      g.addColorStop(0, '#fff3a0'); g.addColorStop(1, '#f2a900');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, 12, 0, 7); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#a66a00'; ctx.lineWidth = 2; ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, 7, 0, 7); ctx.strokeStyle = 'rgba(166,106,0,.6)'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.restore();
    } else {
      const col = it.type === 'shield' ? '79,195,247' : it.type === 'slow' ? '186,104,200' : '239,83,80';
      const icon = it.type === 'shield' ? '🛡️' : it.type === 'slow' ? '⏳' : '🧲';
      ctx.save();
      ctx.shadowColor = `rgba(${col},.9)`; ctx.shadowBlur = 16;
      ctx.fillStyle = `rgba(${col},.85)`;
      ctx.beginPath(); ctx.arc(it.x, y, 17, 0, 7); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.font = '18px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fff';
      ctx.fillText(icon, it.x, y + 1);
      ctx.restore();
    }
  }

  function drawParticles() {
    particles.forEach(p => {
      ctx.fillStyle = `rgba(${p.color},${p.life / p.max})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (p.life / p.max), 0, 7); ctx.fill();
    });
  }

  function drawHUD() {
    if (state === 'ready') return;
    // score
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.font = 'bold 56px "Trebuchet MS", sans-serif';
    ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(0,0,0,.45)';
    ctx.strokeText(score, W / 2, 90);
    ctx.fillStyle = '#fff';
    ctx.fillText(score, W / 2, 90);

    // coins (top right)
    ctx.textAlign = 'right';
    ctx.font = 'bold 22px "Trebuchet MS", sans-serif';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.45)';
    ctx.strokeText(coins, W - 40, 38);
    ctx.fillStyle = '#ffd54a';
    ctx.fillText(coins, W - 40, 38);
    ctx.beginPath(); ctx.arc(W - 24, 30, 9, 0, 7);
    ctx.fillStyle = '#f2a900'; ctx.fill();
    ctx.strokeStyle = '#a66a00'; ctx.lineWidth = 2; ctx.stroke();

    // active power-ups (top left)
    const act = [];
    if (bird.shield) act.push({ icon: '🛡️', pct: 1, col: '#4fc3f7' });
    if (slowT > 0) act.push({ icon: '⏳', pct: slowT / SLOW_TIME, col: '#ba68c8' });
    if (magT > 0) act.push({ icon: '🧲', pct: magT / MAGNET_TIME, col: '#ef5350' });
    act.forEach((a, i) => {
      const x = 16 + i * 44;
      ctx.font = '22px serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fff';
      ctx.fillText(a.icon, x, 30);
      ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(x, 46, 30, 5);
      ctx.fillStyle = a.col; ctx.fillRect(x, 46, 30 * a.pct, 5);
    });

    // theme toast
    if (toast.t > 0) {
      ctx.globalAlpha = Math.min(1, toast.t / 30);
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.font = 'bold 30px "Trebuchet MS", sans-serif';
      ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,.5)';
      ctx.strokeText(toast.text, W / 2, 150);
      ctx.fillStyle = '#fff';
      ctx.fillText(toast.text, W / 2, 150);
      ctx.globalAlpha = 1;
    }
  }

  function drawPreview() {
    pctx.clearRect(0, 0, 120, 80);
    const owned = unlocked.includes(viewIdx);
    pctx.globalAlpha = owned ? 1 : 0.4;
    drawBirdAt(pctx, 60, 40 + Math.sin(frame / 14) * 3, 0, Math.sin(frame / 3), SKINS[viewIdx], 15);
    pctx.globalAlpha = 1;
    if (!owned) {
      pctx.font = '26px serif'; pctx.textAlign = 'center'; pctx.textBaseline = 'middle';
      pctx.fillText('🔒', 60, 40);
    }
  }

  function draw() {
    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (shake > 0.5) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
    drawSky();
    drawClouds();
    drawHills();
    pipes.forEach(drawPipe);
    drawGround();

    // night tint over the world, before items/bird so they stay bright
    if (cur.dark > 0.005) {
      ctx.fillStyle = `rgba(5,10,40,${cur.dark})`;
      ctx.fillRect(0, 0, W, H);
    }
    items.forEach(drawItem);
    drawParticles();
    drawBird();

    // slow-mo tint
    if (slowT > 0) {
      ctx.fillStyle = 'rgba(180,120,255,.10)';
      ctx.fillRect(0, 0, W, H);
    }
    ctx.restore();

    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawHUD();
    ctx.restore();

    if (state === 'ready') drawPreview();
  }

  // ---------- Loop (fixed 60fps logic on any refresh rate) ----------
  let last = performance.now(), acc = 0;
  const STEP = 1000 / 60;
  function loop(now) {
    acc += Math.min(now - last, 100);
    last = now;
    while (acc >= STEP) { update(); acc -= STEP; }
    draw();
    requestAnimationFrame(loop);
  }

  // Sharper rendering on high-DPI screens
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr; canvas.height = H * dpr;

  reset();
  refreshSkinUI();
  requestAnimationFrame(loop);
})();
</script>
</body>
