<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Neon Pac-Maze</title>
<style>
html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 30%,#10104a,#03030f 75%);
display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{border-radius:14px;box-shadow:0 0 40px #1a3cff88,0 0 120px #00aaff33;flex:none}
#pad{display:none;position:relative;width:150px;height:150px;margin-top:8px;flex:none}
body.touch #pad{display:block}
#pad button{position:absolute;width:50px;height:50px;padding:0;border:1px solid #2d6bff;border-radius:14px;
background:rgba(30,60,200,.35);color:#9fc0ff;font-size:22px;box-shadow:0 0 12px #2d6bff88;touch-action:none}
#pad button:active{background:rgba(80,140,255,.75)}
#up{left:50px;top:0}#dn{left:50px;top:100px}#lf{left:0;top:50px}#rt{left:100px;top:50px}
#mu{left:50px;top:50px;font-size:16px;border-radius:25px;background:rgba(30,60,200,.15)}
@media (orientation:landscape){
 body.touch #pad{position:fixed;right:14px;bottom:14px;margin:0;opacity:.8}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="pad">
 <button id="up">▲</button><button id="lf">◀</button><button id="mu">🔊</button>
 <button id="rt">▶</button><button id="dn">▼</button>
</div>
<script>
// ---------- MAP ----------
const MAP=[
"###################",
"#........#........#",
"#o##.###.#.###.##o#",
"#.................#",
"#.##.#.#####.#.##.#",
"#....#...#...#....#",
"####.###...###.####",
"####.####-####.####",
"    .###GGG###.    ",
"####.#########.####",
"#........#........#",
"#.##.###.#.###.##.#",
"#o.#.....P.....#.o#",
"##.#.#.#####.#.#.##",
"#....#...#...#....#",
"#.######.#.######.#",
"#.................#",
"###################"];
const COLS=19,ROWS=MAP.length,T=30,OY=60,TUN=8,W=COLS*T,H=ROWS*T+OY+40;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const dpr=Math.min(window.devicePixelRatio||1,2);
cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
const FRUIT_PTS=[100,300,500,700,1000,2000,3000,5000];

// ---------- responsive fit + touch ----------
const touch=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;
if(touch)document.body.classList.add('touch');
function fit(){
 const land=innerWidth>innerHeight;
 const padH=touch&&!land?166:0;
 const s=Math.min(innerWidth/W,(innerHeight-padH-8)/H);
 cv.style.width=W*s+'px';cv.style.height=H*s+'px';
}
addEventListener('resize',fit);addEventListener('orientationchange',fit);fit();

// ---------- helpers ----------
function isW(c,r){if(r<0||r>=ROWS)return true;if(c<0||c>=COLS)return r!==TUN;return MAP[r][c]==='#';}
function passable(c,r,door){if(c<0||c>=COLS)return r===TUN;if(r<0||r>=ROWS)return false;
 const ch=MAP[r][c];if(ch==='#')return false;if(ch==='-')return door;return true;}
const px=x=>x*T+T/2, py=y=>OY+y*T+T/2;

// ---------- pre-rendered neon maze (door is drawn live) ----------
function buildMaze(col){
 const m=document.createElement('canvas');m.width=W*dpr;m.height=H*dpr;
 const g=m.getContext('2d');g.scale(dpr,dpr);
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(MAP[r][c]==='#'){
  g.fillStyle='rgba(25,40,150,0.28)';g.fillRect(c*T,OY+r*T,T,T);}
 g.lineCap='round';g.strokeStyle=col;g.shadowColor=col;
 for(const [lw,blur] of [[5,18],[2,4]]){
  g.lineWidth=lw;g.shadowBlur=blur;g.beginPath();
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
   if(MAP[r][c]!=='#')continue;const x=c*T,y=OY+r*T;
   if(!isW(c+1,r)){g.moveTo(x+T,y);g.lineTo(x+T,y+T);}
   if(!isW(c-1,r)){g.moveTo(x,y);g.lineTo(x,y+T);}
   if(!isW(c,r+1)){g.moveTo(x,y+T);g.lineTo(x+T,y+T);}
   if(!isW(c,r-1)){g.moveTo(x,y);g.lineTo(x+T,y);}
  }
  g.stroke();
 }
 return m;
}
const mazeB=buildMaze('#2d6bff'),mazeW=buildMaze('#ffffff');

// ---------- audio ----------
let AC=null,muted=false,wk=0;
function beep(f,d,type='square',v=.04,slide=0){
 if(muted||!AC)return;const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;
 o.type=type;o.frequency.setValueAtTime(f,n);
 if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),n+d);
 g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);
 o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d);
}
const muBtn=document.getElementById('mu');
function toggleMute(){muted=!muted;muBtn.textContent=muted?'🔇':'🔊';}

// ---------- state ----------
let score=0,hi=0,lives=3,level=1,state='title',stateT=0,t=0,shake=0,frightT=0,modeT=0,combo=0,dotsLeft=0,totalDots=0;
let doorOpen=0,fruit=null,fruitSpawn=[false,false];
try{hi=+localStorage.getItem('neonpac_hi')||0}catch(e){}
let grid=[],pac,ghosts=[],want={dx:0,dy:0},parts=[],pops=[],rings=[],homeDist=[];
const stars=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.5+.3,p:Math.random()*6}));

function bfsHome(){
 homeDist=Array.from({length:ROWS},()=>Array(COLS).fill(1e9));
 const q=[[9,8]];homeDist[8][9]=0;
 while(q.length){const [c,r]=q.shift();
  for(const d of DIRS){const nc=c+d[0],nr=r+d[1];
   if(nc<0||nc>=COLS||nr<0||nr>=ROWS)continue;
   if(!passable(nc,nr,true)||homeDist[nr][nc]<1e9)continue;
   homeDist[nr][nc]=homeDist[r][c]+1;q.push([nc,nr]);}}
}
bfsHome();

function resetLevel(){
 dotsLeft=0;grid=MAP.map(row=>[...row].map(ch=>{
  if(ch==='.'){dotsLeft++;return 1;}if(ch==='o'){dotsLeft++;return 2;}return 0;}));
 totalDots=dotsLeft;fruitSpawn=[false,false];fruit=null;
}
function resetActors(){
 pac={x:9,y:12,dx:0,dy:0,face:Math.PI,mouth:0};want={dx:0,dy:0};
 const rel=Math.max(.5,1-level*.1);
 ghosts=[
  {name:'blinky',color:'#ff2d2d',x:9,y:6,dx:-1,dy:0,state:'normal',timer:0},
  {name:'pinky',color:'#ff8ad8',x:9,y:8,dx:0,dy:0,state:'house',timer:2*rel},
  {name:'inky',color:'#2df0ff',x:8,y:8,dx:0,dy:0,state:'house',timer:5*rel},
  {name:'clyde',color:'#ffa62d',x:10,y:8,dx:0,dy:0,state:'house',timer:8*rel}
 ].map(g=>({...g,fright:false,bob:0,sway:0}));
 frightT=0;modeT=0;combo=0;fruit=null;
}
function startGame(){score=0;lives=3;level=1;resetLevel();resetActors();state='ready';stateT=2;}

// ---------- movement engine ----------
function advance(e,dist,choose){
 for(let n=0;n<10&&dist>1e-9;n++){
  const cx=Math.round(e.x),cy=Math.round(e.y);
  if(Math.abs(e.x-cx)<1e-6&&Math.abs(e.y-cy)<1e-6){
   e.x=cx;e.y=cy;
   if(cx<=-1&&e.dx<0){e.x=COLS;continue;}
   if(cx>=COLS&&e.dx>0){e.x=-1;continue;}
   choose(e);if(!e.dx&&!e.dy)return;
  }
  let f,to;
  if(e.dx){f=e.x-Math.floor(e.x);to=e.dx>0?(f<1e-6?1:1-f):(f<1e-6?1:f);}
  else{f=e.y-Math.floor(e.y);to=e.dy>0?(f<1e-6?1:1-f):(f<1e-6?1:f);}
  const s=Math.min(dist,to);e.x+=e.dx*s;e.y+=e.dy*s;dist-=s;
 }
}
function pacChoose(p){
 if((want.dx||want.dy)&&passable(p.x+want.dx,p.y+want.dy,false)){p.dx=want.dx;p.dy=want.dy;return;}
 if(!passable(p.x+p.dx,p.y+p.dy,false)){p.dx=0;p.dy=0;}
}
function ghostChoose(g){
 const c=Math.round(g.x),r=Math.round(g.y),door=g.state!=='normal';
 const all=DIRS.filter(d=>passable(c+d[0],r+d[1],door));
 if(!all.length){g.dx=g.dy=0;return;}
 let opts=all.filter(d=>!(d[0]===-g.dx&&d[1]===-g.dy));if(!opts.length)opts=all;
 let pick;
 if(g.state==='eaten'){
  pick=all.reduce((b,d)=>{const v=(homeDist[r+d[1]]||[])[c+d[0]]??1e9;return v<b.v?{d,v}:b;},{d:all[0],v:1e10}).d;
 }else if(g.fright&&g.state==='normal'){pick=opts[Math.floor(Math.random()*opts.length)];}
 else{
  let tx,ty;
  if(g.state==='leave'){tx=9;ty=6;}
  else if((modeT%27)<6&&level<12){tx=[COLS,0,COLS,0][ghosts.indexOf(g)];ty=[0,0,ROWS,ROWS][ghosts.indexOf(g)];}
  else if(g.name==='blinky'){tx=pac.x;ty=pac.y;}
  else if(g.name==='pinky'){tx=pac.x+pac.dx*4;ty=pac.y+pac.dy*4;}
  else if(g.name==='inky'){const b=ghosts[0];tx=2*(pac.x+pac.dx*2)-b.x;ty=2*(pac.y+pac.dy*2)-b.y;}
  else{if(Math.hypot(g.x-pac.x,g.y-pac.y)>8){tx=pac.x;ty=pac.y;}else{tx=0;ty=ROWS;}}
  pick=opts.reduce((b,d)=>{const v=(c+d[0]-tx)**2+(r+d[1]-ty)**2;return v<b.v?{d,v}:b;},{d:opts[0],v:1e12}).d;
 }
 g.dx=pick[0];g.dy=pick[1];
}

// ---------- effects ----------
function burst(x,y,color,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=Math.random()*sp+sp*.3;
 parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.5+Math.random()*.5,max:1,color,size:1.5+Math.random()*2.5});}}
function popup(x,y,txt,color='#fff'){pops.push({x,y,txt,color,life:1});}
function ring(x,y,color){rings.push({x,y,color,life:1});}
function addScore(n){const before=score;score+=n;if(Math.floor(score/10000)>Math.floor(before/10000)){lives++;beep(900,.4,'sine',.06,600);}
 if(score>hi){hi=score;}}
function maybeFruit(){
 const eaten=totalDots-dotsLeft;
 for(let i=0;i<2;i++)if(!fruitSpawn[i]&&eaten>=totalDots*(i?.65:.3)){
  fruitSpawn[i]=true;fruit={x:9,y:12,type:Math.min(level-1,7),life:10};
  ring(px(9),py(12),'#7dff9a');beep(900,.15,'sine',.05,500);}
}

// ---------- update ----------
function update(dt){
 t+=dt;shake=Math.max(0,shake-dt*30);
 parts=parts.filter(p=>(p.life-=dt)>0);parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;});
 pops=pops.filter(p=>(p.life-=dt)>0);pops.forEach(p=>p.y-=dt*30);
 rings=rings.filter(r=>(r.life-=dt*1.6)>0);
 // ghost-house door opens when a ghost passes through
 let busy=false;
 for(const g of ghosts)if((g.state==='leave'||g.state==='eaten')&&g.y>=5.5&&g.y<=8.5&&Math.abs(g.x-9)<1.2)busy=true;
 doorOpen=Math.max(0,Math.min(1,doorOpen+(busy?1:-1)*dt*5));
 if(state==='ready'){stateT-=dt;if(stateT<=0)state='play';}
 else if(state==='play')updatePlay(dt);
 else if(state==='dying'){stateT+=dt;if(stateT>1.8){lives--;
  if(lives<0){state='over';try{localStorage.setItem('neonpac_hi',hi)}catch(e){}}
  else{resetActors();state='ready';stateT=2;}}}
 else if(state==='won'){stateT+=dt;if(stateT>2.2){level++;resetLevel();resetActors();state='ready';stateT=2;}}
}
function updatePlay(dt){
 if(frightT>0){frightT-=dt;if(frightT<=0)ghosts.forEach(g=>g.fright=false);}else modeT+=dt;
 if((want.dx||want.dy)&&(pac.dx||pac.dy)&&pac.dx===-want.dx&&pac.dy===-want.dy){pac.dx=want.dx;pac.dy=want.dy;}
 const pSp=Math.min(8,6.2+level*.15);
 advance(pac,pSp*dt,pacChoose);
 if(pac.dx||pac.dy){pac.face=Math.atan2(pac.dy,pac.dx);pac.mouth+=dt*14;}
 const cx=Math.round(pac.x),cy=Math.round(pac.y);
 if(cx>=0&&cx<COLS&&grid[cy]&&grid[cy][cx]&&Math.hypot(pac.x-cx,pac.y-cy)<.45){
  const v=grid[cy][cx];grid[cy][cx]=0;dotsLeft--;
  if(v===1){addScore(10);beep(wk++%2?330:260,.07,'triangle',.05);burst(px(cx),py(cy),'#ffe6b0',3,40);}
  else{addScore(50);combo=0;frightT=Math.max(2.5,7-level*.6);beep(120,.4,'sawtooth',.05,400);burst(px(cx),py(cy),'#fff',22,120);
   ghosts.forEach(g=>{if(g.state==='normal'||g.state==='leave'){g.fright=true;g.dx*=-1;g.dy*=-1;}});}
  maybeFruit();
  if(dotsLeft<=0){state='won';stateT=0;fruit=null;beep(500,.6,'sine',.06,800);return;}
 }
 // fruit bonus
 if(fruit){
  fruit.life-=dt;
  if(fruit.life<=0)fruit=null;
  else if(Math.hypot(pac.x-fruit.x,pac.y-fruit.y)<.6){
   const pts=FRUIT_PTS[fruit.type];addScore(pts);
   popup(px(fruit.x),py(fruit.y),pts,'#7dff9a');burst(px(fruit.x),py(fruit.y),'#7dff9a',24,130);
   ring(px(fruit.x),py(fruit.y),'#7dff9a');beep(800,.3,'sine',.06,700);fruit=null;
  }
 }
 const gSp=Math.min(7.2,5.6+level*.25);
 ghosts.forEach((g,i)=>{
  if(g.state==='house'){
   g.timer-=dt;g.bob=Math.sin(t*8+i*1.7)*.1;g.sway=g.timer<.8?Math.sin(t*50)*.05:0;
   if(g.timer<=0){g.state='leave';g.bob=0;g.sway=0;g.dx=g.dy=0;
    ring(px(g.x),py(g.y),g.color);burst(px(9),py(7),'#ff9ad5',10,60);beep(220,.12,'sine',.03,200);}
   return;}
  if(g.state==='eaten'&&g.x===9&&g.y===8){g.state='leave';g.fright=false;g.dx=g.dy=0;
   ring(px(9),py(8),g.color);burst(px(9),py(8),g.color,18,90);beep(400,.2,'sine',.05,500);}
  if(g.state==='leave'&&g.x===9&&g.y<=6)g.state='normal';
  const sp=g.state==='eaten'?11:(g.fright&&g.state==='normal')?3.3:g.state==='leave'?4.5:gSp;
  advance(g,sp*dt,ghostChoose);
 });
 for(const g of ghosts){
  if(g.state==='house'||g.state==='eaten')continue;
  if(Math.hypot(g.x-pac.x,g.y-pac.y)<.65){
   if(g.fright){g.state='eaten';g.fright=false;combo++;const pts=100*2**combo;addScore(pts);
    popup(px(g.x),py(g.y),pts,'#2df0ff');burst(px(g.x),py(g.y),g.color,26,150);beep(700,.25,'square',.05,600);}
   else{state='dying';stateT=0;shake=14;burst(px(pac.x),py(pac.y),'#ffe600',40,180);beep(500,1,'sawtooth',.06,-420);return;}
  }
 }
}

// ---------- drawing ----------
function drawPac(){
 const x=px(pac.x),y=py(pac.y),R=T*.46;
 let m=.04+Math.abs(Math.sin(pac.mouth))*.28;m*=Math.PI;
 if(state==='dying'){const p=Math.min(1,stateT/1.4);if(p>=1)return;m=Math.PI*p;}
 ctx.save();ctx.translate(x,y);ctx.rotate(pac.face);
 ctx.shadowColor='#ffe600';ctx.shadowBlur=22;
 const g=ctx.createRadialGradient(-R*.3,-R*.3,2,0,0,R);g.addColorStop(0,'#fff9a0');g.addColorStop(.5,'#ffe600');g.addColorStop(1,'#e0a800');
 ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,m,Math.PI*2-m);ctx.closePath();ctx.fill();
 ctx.restore();
}
function drawGhost(g){
 const x=px(g.x)+(g.sway||0)*T,y=py(g.y+g.bob),r=T*.46;
 const flash=frightT>0&&frightT<2&&Math.floor(t*8)%2;
 const lookX=g.dx,lookY=g.state==='house'?-1:g.dy;
 if(g.state!=='eaten'){
  const fr=g.fright&&g.state!=='eaten';
  let col=fr?(flash?'#ffffff':'#2233ff'):g.color;
  if(g.state==='house'&&g.timer<.8&&Math.floor(t*14)%2)col='#ffffff';
  ctx.save();ctx.shadowColor=col;ctx.shadowBlur=g.state==='house'?10:18;
  const gr=ctx.createLinearGradient(x,y-r,x,y+r);gr.addColorStop(0,col);gr.addColorStop(1,fr?'#000a88':shade(col));
  ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y-1,r,Math.PI,0);ctx.lineTo(x+r,y+r);
  const w=r*2/4;
  for(let i=0;i<4;i++){const x1=x+r-w*(i+1),cxp=x+r-w*(i+.5);
   ctx.quadraticCurveTo(cxp,y+r+(i%2?-6:5)*(.6+.4*Math.sin(t*12)),x1,y+r);}
  ctx.closePath();ctx.fill();ctx.restore();
  if(fr){ctx.fillStyle=flash?'#f33':'#ffd0d0';
   ctx.fillRect(x-5,y-4,3,3);ctx.fillRect(x+3,y-4,3,3);
   ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=1.5;ctx.beginPath();
   for(let i=0;i<=6;i++)ctx.lineTo(x-7+i*2.4,y+5+(i%2?-2:2));ctx.stroke();return;}
 }
 for(const s of[-1,1]){
  ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(x+s*r*.38,y-3,4.2,5.2,0,0,6.283);ctx.fill();
  ctx.fillStyle='#1a3cff';ctx.beginPath();ctx.arc(x+s*r*.38+lookX*2.2,y-3+lookY*2.5,2.3,0,6.283);ctx.fill();
 }
}
function shade(c){const n=parseInt(c.slice(1),16);const f=v=>Math.max(0,Math.floor(v*.55));
 return `rgb(${f(n>>16)},${f((n>>8)&255)},${f(n&255)})`;}

function drawHouse(){
 const n=ghosts.filter(g=>g.state==='house').length;
 const a=.10+.05*n+.2*doorOpen;
 const x=px(9),y=py(8),gr=ctx.createRadialGradient(x,y,2,x,y,T*2.2);
 gr.addColorStop(0,`rgba(255,120,200,${a})`);gr.addColorStop(1,'rgba(255,120,200,0)');
 ctx.fillStyle=gr;ctx.fillRect(x-T*2.5,y-T*2.5,T*5,T*5);
}
function drawDoor(){
 const y=py(7),x0=9*T+3,x1=10*T-3,mid=(x0+x1)/2,half=(x1-x0)/2,gap=half*doorOpen;
 ctx.save();ctx.strokeStyle='#ff9ad5';ctx.shadowColor='#ff9ad5';ctx.shadowBlur=10+10*doorOpen;
 ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();
 if(gap<half-1){ctx.moveTo(x0,y);ctx.lineTo(mid-gap,y);ctx.moveTo(mid+gap,y);ctx.lineTo(x1,y);}
 ctx.stroke();ctx.restore();
}

function drawFruitIcon(type,x,y,s){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.shadowColor='rgba(255,255,255,.6)';ctx.shadowBlur=10;
 ctx.lineCap='round';
 if(type===0){ // cherry
  ctx.strokeStyle='#7bd35a';ctx.lineWidth=2;ctx.beginPath();
  ctx.moveTo(-5,5);ctx.quadraticCurveTo(-3,-8,3,-11);ctx.moveTo(5,4);ctx.quadraticCurveTo(5,-6,3,-11);ctx.stroke();
  ctx.fillStyle='#ff2a4a';ctx.beginPath();ctx.arc(-5,6,5.5,0,6.283);ctx.arc(5,5,5.5,0,6.283);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.arc(-6.5,4,1.5,0,6.283);ctx.arc(3.5,3,1.5,0,6.283);ctx.fill();
 }else if(type===1){ // strawberry
  ctx.fillStyle='#ff3355';ctx.beginPath();ctx.moveTo(0,10);ctx.bezierCurveTo(-13,3,-10,-8,0,-6);
  ctx.bezierCurveTo(10,-8,13,3,0,10);ctx.fill();
  ctx.fillStyle='#5be36a';ctx.beginPath();ctx.ellipse(0,-7,6,2.5,0,0,6.283);ctx.fill();
  ctx.fillStyle='#ffe69a';for(const p of[[-4,-1],[3,-2],[0,3],[-3,5],[4,4]]){ctx.fillRect(p[0],p[1],1.6,1.6);}
 }else if(type===2){ // orange
  ctx.fillStyle='#ff9a1f';ctx.beginPath();ctx.arc(0,2,9,0,6.283);ctx.fill();
  ctx.fillStyle='#5be36a';ctx.beginPath();ctx.ellipse(3,-8,5,2.2,-.5,0,6.283);ctx.fill();
 }else if(type===3){ // apple
  ctx.fillStyle='#ff3b3b';ctx.beginPath();ctx.arc(-3,3,7,0,6.283);ctx.arc(3,3,7,0,6.283);ctx.fill();
  ctx.strokeStyle='#8a5a2b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-3);ctx.lineTo(1,-9);ctx.stroke();
  ctx.fillStyle='#5be36a';ctx.beginPath();ctx.ellipse(5,-7,4,2,-.5,0,6.283);ctx.fill();
 }else if(type===4){ // melon
  ctx.fillStyle='#5fdc55';ctx.beginPath();ctx.arc(0,1,10,0,6.283);ctx.fill();
  ctx.strokeStyle='#2b9a3a';ctx.lineWidth=1.5;ctx.beginPath();
  for(const a of[-.8,0,.8]){ctx.moveTo(Math.sin(a)*10,1-Math.cos(a)*10);ctx.lineTo(Math.sin(a)*10,1+Math.cos(a)*10);}
  ctx.stroke();
 }else if(type===5){ // star
  ctx.fillStyle='#ffe600';ctx.beginPath();
  for(let i=0;i<10;i++){const r=i%2?4.5:11,a=-Math.PI/2+i*Math.PI/5;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r+1);}
  ctx.closePath();ctx.fill();
 }else if(type===6){ // bell
  ctx.fillStyle='#ffd23a';ctx.beginPath();ctx.moveTo(-9,7);ctx.bezierCurveTo(-9,-2,-6,-10,0,-10);
  ctx.bezierCurveTo(6,-10,9,-2,9,7);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,9,2.5,0,6.283);ctx.fill();
 }else{ // key
  ctx.strokeStyle='#2df0ff';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,-6,4,0,6.283);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,-2);ctx.lineTo(0,10);ctx.moveTo(0,6);ctx.lineTo(4,6);ctx.moveTo(0,10);ctx.lineTo(4,10);ctx.stroke();
 }
 ctx.restore();
}

function text(s,x,y,size,color,align='center',glow=12){
 ctx.font=`700 ${size}px "Segoe UI",Arial,sans-serif`;ctx.textAlign=align;ctx.fillStyle=color;
 ctx.shadowColor=color;ctx.shadowBlur=glow;ctx.fillText(s,x,y);ctx.shadowBlur=0;
}
function draw(){
 ctx.save();
 if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#05051c');bg.addColorStop(1,'#0b0b32');
 ctx.fillStyle=bg;ctx.fillRect(-20,-20,W+40,H+40);
 for(const s of stars){ctx.globalAlpha=.3+.3*Math.sin(t*2+s.p);ctx.fillStyle='#8fb4ff';ctx.fillRect(s.x,s.y,s.s,s.s);}
 ctx.globalAlpha=1;
 ctx.drawImage(state==='won'&&Math.floor(stateT*6)%2?mazeW:mazeB,0,0,W,H);
 drawHouse();drawDoor();
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const v=grid[r]&&grid[r][c];if(!v)continue;
  ctx.save();ctx.shadowColor='#ffd9a0';ctx.shadowBlur=v===2?20:6;ctx.fillStyle=v===2?'#fff4d6':'#ffe0a8';
  ctx.beginPath();ctx.arc(px(c),py(r),v===2?5+Math.sin(t*8)*1.8:2.2,0,6.283);ctx.fill();ctx.restore();}
 if(fruit&&!(fruit.life<3&&Math.floor(t*10)%2))drawFruitIcon(fruit.type,px(fruit.x),py(fruit.y)+Math.sin(t*4)*2,1.3);
 if(pac){
  if(!(state==='dying'&&stateT>.4))ghosts.forEach(drawGhost);
  drawPac();
 }
 for(const r of rings){ctx.globalAlpha=Math.max(0,r.life);ctx.strokeStyle=r.color;ctx.lineWidth=3;ctx.shadowColor=r.color;ctx.shadowBlur=10;
  ctx.beginPath();ctx.arc(r.x,r.y,(1-r.life)*T*1.5+4,0,6.283);ctx.stroke();}
 ctx.globalAlpha=1;ctx.shadowBlur=0;
 for(const p of parts){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=8;
  ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,6.283);ctx.fill();}
 ctx.globalAlpha=1;ctx.shadowBlur=0;
 for(const p of pops){ctx.globalAlpha=Math.min(1,p.life*2);text(p.txt,p.x,p.y,16,p.color);}
 ctx.globalAlpha=1;
 // HUD
 text('SCORE',20,24,14,'#7ea6ff','left',6);text(String(score).padStart(6,'0'),20,46,22,'#fff','left');
 text('HIGH',W/2,24,14,'#7ea6ff','center',6);text(String(hi).padStart(6,'0'),W/2,46,22,'#ffe600','center');
 text('LEVEL',W-20,24,14,'#7ea6ff','right',6);text(String(level),W-20,46,22,'#fff','right');
 for(let i=0;i<lives;i++){ctx.save();ctx.translate(26+i*30,H-20);ctx.shadowColor='#ffe600';ctx.shadowBlur=10;ctx.fillStyle='#ffe600';
  ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,10,.5,6.28-.5);ctx.fill();ctx.restore();}
 drawFruitIcon(Math.min(level-1,7),W/2,H-20,.8);
 text(muted?'M: sound off':'M: mute',W-20,H-14,12,'#556',"right",0);
 if(state==='ready')text('READY!',W/2,OY+10*T+T*.72,22,'#ffe600');
 if(state==='title'||state==='over'){
  ctx.fillStyle='rgba(2,2,20,.72)';ctx.fillRect(0,0,W,H);
  text(state==='over'?'GAME OVER':'NEON PAC-MAZE',W/2,H/2-40,state==='over'?44:38,state==='over'?'#ff4060':'#ffe600',"center",24);
  if(state==='over')text('Score '+score,W/2,H/2,22,'#fff');
  text('Tap / press any key to '+(state==='over'?'retry':'start'),W/2,H/2+46,18,'#2df0ff');
  text('Arrows / WASD, swipe or D-pad',W/2,H/2+76,14,'#8fa4ff',"center",4);
 }
 ctx.restore();
}

// ---------- input ----------
function kick(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
 if(AC&&AC.state==='suspended')AC.resume();if(state==='title'||state==='over')startGame();}
function setDir(dx,dy){want={dx,dy};}
addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();
 const map={arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0],arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1]};
 if(k==='m'){toggleMute();return;}
 if(map[k]||k===' '||k==='enter'){e.preventDefault();kick();}
 if(map[k])setDir(...map[k]);
});
let tx=0,ty=0;
cv.addEventListener('touchstart',e=>{const p=e.touches[0];tx=p.clientX;ty=p.clientY;kick();},{passive:true});
cv.addEventListener('touchmove',e=>{e.preventDefault();const p=e.touches[0],dx=p.clientX-tx,dy=p.clientY-ty;
 if(Math.hypot(dx,dy)>22){Math.abs(dx)>Math.abs(dy)?setDir(dx>0?1:-1,0):setDir(0,dy>0?1:-1);tx=p.clientX;ty=p.clientY;}},{passive:false});
cv.addEventListener('mousedown',kick);

// on-screen D-pad
const padMap={up:[0,-1],dn:[0,1],lf:[-1,0],rt:[1,0]};
for(const id in padMap){
 document.getElementById(id).addEventListener('pointerdown',e=>{e.preventDefault();kick();setDir(...padMap[id]);});
}
muBtn.addEventListener('pointerdown',e=>{e.preventDefault();kick();toggleMute();});
document.getElementById('pad').addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('touchstart',()=>{if(!document.body.classList.contains('touch')){document.body.classList.add('touch');fit();}},{once:true,passive:true});

// ---------- boot ----------
resetLevel();resetActors();
let last=performance.now();
(function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop);})(last);
</script>
</body>
