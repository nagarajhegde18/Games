<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Match</title>
<style>
  :root{
    --bg1:#0f0c29; --bg2:#302b63; --bg3:#24243e;
    --accent:#7c5cff; --accent2:#00e5ff; --good:#2ee59d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Segoe UI',system-ui,sans-serif;
    color:#fff;
    background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
    background-size:300% 300%;
    animation:bgmove 18s ease infinite;
    display:flex;flex-direction:column;align-items:center;
    padding:16px;overflow-x:hidden;
  }
  @keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

  /* floating orbs */
  .orb{position:fixed;border-radius:50%;filter:blur(60px);opacity:.35;z-index:0;animation:float 12s ease-in-out infinite}
  .orb.a{width:260px;height:260px;background:var(--accent);top:-60px;left:-60px}
  .orb.b{width:300px;height:300px;background:var(--accent2);bottom:-80px;right:-80px;animation-delay:-5s}
  @keyframes float{50%{transform:translate(30px,40px) scale(1.1)}}

  .wrap{position:relative;z-index:1;width:100%;max-width:640px}
  h1{
    text-align:center;font-size:clamp(1.8rem,6vw,2.6rem);margin:6px 0 14px;
    background:linear-gradient(90deg,var(--accent2),var(--accent),#ff5ca8);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    letter-spacing:1px;
  }
  .stats{
    display:flex;gap:10px;justify-content:space-between;margin-bottom:14px;
  }
  .stat{
    flex:1;text-align:center;padding:10px 6px;border-radius:14px;
    background:rgba(255,255,255,.08);backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.15);
  }
  .stat small{display:block;opacity:.7;font-size:.7rem;text-transform:uppercase;letter-spacing:1px}
  .stat b{font-size:1.3rem}

  .controls{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
  button{
    font:inherit;color:#fff;cursor:pointer;border:none;border-radius:12px;
    padding:9px 16px;background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.2);transition:.2s;
  }
  button:hover{background:rgba(255,255,255,.2);transform:translateY(-2px)}
  button.active{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}
  button.primary{background:linear-gradient(135deg,#ff5ca8,var(--accent))}

  .board{display:grid;gap:10px;perspective:1000px}
  .card{
    aspect-ratio:1;position:relative;cursor:pointer;
    transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,.2,.2,1);
  }
  .card.flipped,.card.matched{transform:rotateY(180deg)}
  .face{
    position:absolute;inset:0;border-radius:16px;
    display:flex;align-items:center;justify-content:center;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.4);
  }
  .front{
    background:
      radial-gradient(circle at 30% 25%,rgba(255,255,255,.35),transparent 40%),
      linear-gradient(135deg,var(--accent),#3a1fd1);
    border:2px solid rgba(255,255,255,.25);
    font-size:clamp(1.2rem,5vw,2rem);
  }
  .front::after{content:"✦";opacity:.8;animation:pulse 2.5s infinite}
  @keyframes pulse{50%{transform:scale(1.25);opacity:.4}}
  .back{
    transform:rotateY(180deg);
    background:linear-gradient(145deg,#ffffff,#d9e4ff);
    font-size:clamp(1.8rem,8vw,3rem);
    border:2px solid rgba(255,255,255,.6);
  }
  .card:not(.flipped):not(.matched):hover{transform:translateY(-5px) scale(1.04)}
  .card.matched .back{
    background:linear-gradient(145deg,#d6ffe9,#7dffc4);
    box-shadow:0 0 25px var(--good);
    animation:glow 1s ease;
  }
  @keyframes glow{50%{box-shadow:0 0 45px var(--good),0 0 80px var(--good)}}
  .card.shake{animation:shake .4s}
  @keyframes shake{25%{transform:rotateY(180deg) translateX(-6px)}75%{transform:rotateY(180deg) translateX(6px)}}

  /* win modal */
  .modal{
    position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);
    display:none;align-items:center;justify-content:center;z-index:10;padding:20px;
  }
  .modal.show{display:flex}
  .modal .box{
    background:linear-gradient(145deg,#2b2466,#17143a);
    border:1px solid rgba(255,255,255,.2);border-radius:24px;
    padding:30px;text-align:center;max-width:340px;width:100%;
    animation:pop .5s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes pop{from{transform:scale(.5);opacity:0}}
  .box h2{font-size:2rem;margin-bottom:8px}
  .box p{opacity:.85;margin:4px 0}
  .stars{font-size:2rem;margin:10px 0}
  canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:20}
</style>
</head>
<body>
<div class="orb a"></div><div class="orb b"></div>
<canvas id="fx"></canvas>

<div class="wrap">
  <h1>🧠 Memory Match</h1>

  <div class="stats">
    <div class="stat"><small>Moves</small><b id="moves">0</b></div>
    <div class="stat"><small>Time</small><b id="time">0:00</b></div>
    <div class="stat"><small>Best</small><b id="best">–</b></div>
  </div>

  <div class="controls">
    <button data-size="4" class="active">Easy 4×4</button>
    <button data-size="6">Hard 6×6</button>
    <button id="restart" class="primary">↻ New Game</button>
    <button id="sound">🔊</button>
  </div>

  <div class="board" id="board"></div>
</div>

<div class="modal" id="modal">
  <div class="box">
    <h2>🎉 You Won!</h2>
    <div class="stars" id="stars"></div>
    <p id="result"></p>
    <p id="newbest"></p>
    <br>
    <button class="primary" id="again">Play Again</button>
  </div>
</div>

<script>
const EMOJIS = ['🐶','🐱','🦊','🐼','🐸','🦁','🐵','🐙','🦄','🐢','🦋','🐬','🍎','🍕','🚀','⚽','🎸','💎'];
const board = document.getElementById('board');
const movesEl = document.getElementById('moves');
const timeEl = document.getElementById('time');
const bestEl = document.getElementById('best');
const modal = document.getElementById('modal');

let size = 4, first = null, lock = false, moves = 0, matched = 0, seconds = 0, timer = null, started = false, soundOn = true;

/* ---------- Sound (WebAudio, no files needed) ---------- */
let actx;
function beep(freq, dur = .12, type = 'sine', vol = .15){
  if(!soundOn) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  }catch(e){}
}
const sFlip = () => beep(500, .08);
const sMatch = () => { beep(660,.12); setTimeout(()=>beep(880,.18),110); };
const sWrong = () => beep(180, .25, 'sawtooth', .1);
const sWin = () => [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.25),i*140));

/* ---------- Helpers ---------- */
const fmt = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const bestKey = () => 'memmatch_best_' + size;
function loadBest(){
  let b = null;
  try{ b = localStorage.getItem(bestKey()); }catch(e){}
  bestEl.textContent = b ? b + ' mv' : '–';
  return b ? +b : null;
}
function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* ---------- Game ---------- */
function newGame(){
  clearInterval(timer);
  started = false; first = null; lock = false; moves = 0; matched = 0; seconds = 0;
  movesEl.textContent = 0; timeEl.textContent = '0:00';
  modal.classList.remove('show');
  loadBest();

  const pairs = (size*size)/2;
  const deck = shuffle([...EMOJIS].slice(0,pairs).flatMap(e => [e,e]));
  const cols = size;
  board.style.gridTemplateColumns = `repeat(${cols},1fr)`;
  board.style.gap = size === 6 ? '6px' : '10px';
  board.innerHTML = '';

  deck.forEach(e => {
    const c = document.createElement('div');
    c.className = 'card';
    c.dataset.v = e;
    c.innerHTML = `<div class="face front"></div><div class="face back">${e}</div>`;
    c.addEventListener('click', () => flip(c));
    board.appendChild(c);
  });
}

function startTimer(){
  started = true;
  timer = setInterval(()=>{ seconds++; timeEl.textContent = fmt(seconds); }, 1000);
}

function flip(c){
  if(lock || c.classList.contains('flipped') || c.classList.contains('matched')) return;
  if(!started) startTimer();
  c.classList.add('flipped'); sFlip();

  if(!first){ first = c; return; }

  moves++; movesEl.textContent = moves;
  const second = c;
  lock = true;

  if(first.dataset.v === second.dataset.v){
    setTimeout(()=>{
      first.classList.add('matched'); second.classList.add('matched');
      sMatch(); burst(second);
      matched += 2; first = null; lock = false;
      if(matched === size*size) win();
    }, 450);
  } else {
    const a = first, b = second;
    setTimeout(()=>{ a.classList.add('shake'); b.classList.add('shake'); sWrong(); }, 500);
    setTimeout(()=>{
      a.classList.remove('flipped','shake'); b.classList.remove('flipped','shake');
      first = null; lock = false;
    }, 1000);
  }
}

function win(){
  clearInterval(timer); sWin(); confetti();
  const pairs = (size*size)/2;
  const rating = moves <= pairs*1.5 ? 3 : moves <= pairs*2.2 ? 2 : 1;
  document.getElementById('stars').textContent = '⭐'.repeat(rating) + '☆'.repeat(3-rating);
  document.getElementById('result').textContent = `${moves} moves · ${fmt(seconds)}`;
  const best = loadBest();
  const nb = document.getElementById('newbest');
  if(best === null || moves < best){
    try{ localStorage.setItem(bestKey(), moves); }catch(e){}
    nb.textContent = '🏆 New best score!'; loadBest();
  } else nb.textContent = `Best: ${best} moves`;
  setTimeout(()=>modal.classList.add('show'), 700);
}

/* ---------- Particle effects ---------- */
const cv = document.getElementById('fx'), ctx = cv.getContext('2d');
let parts = [];
function resize(){ cv.width = innerWidth; cv.height = innerHeight; }
addEventListener('resize', resize); resize();

function burst(el){
  const r = el.getBoundingClientRect();
  const x = r.left + r.width/2, y = r.top + r.height/2;
  for(let i=0;i<22;i++){
    const a = Math.random()*Math.PI*2, s = 2 + Math.random()*4;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:40,max:40,
      c:`hsl(${140+Math.random()*60},100%,65%)`,r:3+Math.random()*3,g:.05});
  }
  loop();
}
function confetti(){
  for(let i=0;i<160;i++){
    parts.push({x:Math.random()*cv.width,y:-20,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,
      life:140,max:140,c:`hsl(${Math.random()*360},100%,60%)`,r:4+Math.random()*4,g:.06});
  }
  loop();
}
let running = false;
function loop(){
  if(running) return; running = true;
  (function frame(){
    ctx.clearRect(0,0,cv.width,cv.height);
    parts = parts.filter(p => p.life > 0);
    parts.forEach(p=>{
      p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life--;
      ctx.globalAlpha = Math.max(p.life/p.max,0);
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha = 1;
    if(parts.length) requestAnimationFrame(frame);
    else { running = false; ctx.clearRect(0,0,cv.width,cv.height); }
  })();
}

/* ---------- Controls ---------- */
document.querySelectorAll('[data-size]').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('[data-size]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); size = +b.dataset.size; newGame();
  });
});
document.getElementById('restart').onclick = newGame;
document.getElementById('again').onclick = newGame;
document.getElementById('sound').onclick = e => {
  soundOn = !soundOn; e.target.textContent = soundOn ? '🔊' : '🔇';
};

newGame();
</script>
</body>
</html>
